<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AJ — Personal Intelligence System</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --cyan: #00d9ff;
    --blue: #168cff;
    --green: #00ff9d;
    --dark: #01050a;
    --panel: rgba(3, 18, 30, 0.76);
    --line: rgba(0, 217, 255, 0.25);
    --glow: rgba(0, 217, 255, 0.5);
    --state: #00ff9d;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {
    overflow: hidden;
    background: #000000;
    color: #e9fbff;
    font-family: Arial, Helvetica, sans-serif;
}


/* ============================================================
   BACKGROUND
============================================================ */

.grid {
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0;

    background-image:
        linear-gradient(
            rgba(0,217,255,.08) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(0,217,255,.08) 1px,
            transparent 1px
        );

    background-size: 55px 55px;

    mask-image:
        radial-gradient(
            circle,
            black 15%,
            transparent 78%
        );
}

.scanlines {
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0;

    background:
        repeating-linear-gradient(
            0deg,
            transparent,
            transparent 3px,
            rgba(255,255,255,.08) 4px
        );

    z-index: 100;
}


/* ============================================================
   APP
============================================================ */

.app {
    position: relative;
    width: 100%;
    height: 100vh;

    display: flex;
    flex-direction: column;
}


/* ============================================================
   TOP BAR
============================================================ */

.topbar {
    height: 72px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 25px;

    border-bottom:
        1px solid rgba(0,217,255,.16);

    background:
        rgba(0,5,10,.58);

    backdrop-filter: blur(14px);

    z-index: 20;
}

.brand {
    display: flex;
    align-items: center;
    gap: 13px;
}

.brand-mark {
    width: 42px;
    height: 42px;

    display: flex;
    align-items: center;
    justify-content: center;

    border:
        1px solid var(--cyan);

    color: white;

    font-size: 16px;
    font-weight: bold;
    letter-spacing: 1px;

    box-shadow:
        0 0 15px rgba(0,217,255,.35),
        inset 0 0 12px rgba(0,217,255,.12);
}

.brand-title {
    font-size: 18px;
    letter-spacing: 5px;
    font-weight: 600;
}

.brand-sub {
    margin-top: 3px;

    color: #57899b;

    font-size: 8px;
    letter-spacing: 2px;
}

.system-status {
    display: flex;
    align-items: center;
    gap: 9px;

    padding: 8px 13px;

    border:
        1px solid var(--line);

    background:
        rgba(0,20,32,.55);

    font-size: 9px;
    letter-spacing: 1.5px;
}

.status-dot {
    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: var(--state);

    box-shadow:
        0 0 12px var(--state);

    transition:
        background .25s,
        box-shadow .25s;
}


/* ============================================================
   HUD
============================================================ */

.hud-area {
    position: relative;

    flex: 1;
    min-height: 0;

    display: flex;
    align-items: center;
    justify-content: center;
}


/* ============================================================
   SIDE PANELS
============================================================ */

.side-panel {
    position: absolute;

    width: 190px;

    box-shadow:
        3px 0 0 rgba(255,23,68,.55),
        0 0 25px rgba(0,0,0,.25);

    padding: 14px;

    border:
        1px solid rgba(0,217,255,.20);

    background:
        var(--panel);

    backdrop-filter: blur(9px);

    font-size: 9px;

    color: #6197a9;

    box-shadow:
        0 0 25px rgba(0,0,0,.25);
}

 .side-panel.left {
    left: 22px;
    top: 18%;
}

.side-panel.right {
    left: 22px;
    right: auto;
    top: 48%;
}

.panel-title {
    color: var(--cyan);

    font-size: 10px;
    letter-spacing: 2px;

    margin-bottom: 12px;
}

.data-row {
    display: flex;
    justify-content: space-between;

    padding: 7px 0;

    border-bottom:
        1px solid rgba(0,217,255,.08);
}

.data-value {
    color: #b9efff;
}

.graph {
    height: 45px;

    margin-top: 9px;

    overflow: hidden;

    position: relative;

    border-top:
        1px solid rgba(0,217,255,.15);

    border-bottom:
        1px solid rgba(0,217,255,.15);
}

.graph-line {
    position: absolute;

    width: 180%;
    height: 100%;

    left: -20%;

    background:
        linear-gradient(
            135deg,
            transparent 0 10%,
            rgba(0,217,255,.65) 10.5%,
            transparent 11% 19%,
            rgba(0,217,255,.55) 19.5%,
            transparent 20% 29%,
            rgba(0,217,255,.75) 29.5%,
            transparent 30% 42%,
            rgba(0,217,255,.45) 42.5%,
            transparent 43%
        );

    animation:
        graphMove 4s linear infinite;
}

@keyframes graphMove {

    from {
        transform: translateX(0);
    }

    to {
        transform: translateX(18%);
    }
}


/* ============================================================
   CORE SYSTEM
============================================================ */

.core-system {
    width: min(440px, 65vw);
    height: min(440px, 65vw);

    position: relative;

    display: flex;
    align-items: center;
    justify-content: center;

    transition:
        filter .3s;
}


/* ============================================================
   RINGS
============================================================ */

.ring {
    position: absolute;

    border-radius: 50%;

    border:
        1px solid var(--line);

    transition:
        border-color .3s,
        animation-duration .4s;
}

.ring.one {
    width: 100%;
    height: 100%;

    border-top-color:
        var(--state);

    border-bottom-color:
        rgba(0,217,255,.07);

    animation:
        spin 18s linear infinite;
}

.ring.two {
    width: 87%;
    height: 87%;

    border-left-color:
        var(--state);

    border-right-color:
        rgba(0,217,255,.05);

    animation:
        spinReverse 14s linear infinite;
}

.ring.three {
    width: 72%;
    height: 72%;

    border-top:
        2px solid var(--state);

    border-bottom:
        2px solid rgba(0,217,255,.07);

    animation:
        spin 10s linear infinite;
}

.ring.four {
    width: 59%;
    height: 59%;

    border:
        2px dashed var(--state);

    animation:
        spinReverse 8s linear infinite;
}

@keyframes spin {

    to {
        transform: rotate(360deg);
    }
}

@keyframes spinReverse {

    to {
        transform: rotate(-360deg);
    }
}


/* ============================================================
   MARKERS
============================================================ */

.marker-ring {
    position: absolute;

    width: 94%;
    height: 94%;

    border-radius: 50%;

    animation:
        spin 25s linear infinite;
}

.marker-ring span {
    position: absolute;

    width: 2px;
    height: 13px;

    left: 50%;
    top: -6px;

    background:
        var(--state);

    box-shadow:
        0 0 8px var(--state);
}

.marker-ring span:nth-child(2) {
    transform:
        rotate(45deg);

    transform-origin:
        0 226px;
}

.marker-ring span:nth-child(3) {
    transform:
        rotate(90deg);

    transform-origin:
        0 226px;
}

.marker-ring span:nth-child(4) {
    transform:
        rotate(135deg);

    transform-origin:
        0 226px;
}

.marker-ring span:nth-child(5) {
    transform:
        rotate(180deg);

    transform-origin:
        0 226px;
}

.marker-ring span:nth-child(6) {
    transform:
        rotate(225deg);

    transform-origin:
        0 226px;
}

.marker-ring span:nth-child(7) {
    transform:
        rotate(270deg);

    transform-origin:
        0 226px;
}

.marker-ring span:nth-child(8) {
    transform:
        rotate(315deg);

    transform-origin:
        0 226px;
}


/* ============================================================
   SCANNER
============================================================ */

.scanner {
    position: absolute;

    width: 100%;
    height: 2px;

    background:
        linear-gradient(
            90deg,
            transparent,
            var(--state),
            transparent
        );

    filter:
        drop-shadow(
            0 0 8px var(--state)
        );

    animation:
        scan 5s linear infinite;

    transition:
        animation-duration .4s;
}

@keyframes scan {

    from {
        transform:
            rotate(0deg);
    }

    to {
        transform:
            rotate(360deg);
    }
}


/* ============================================================
   AI CORE
============================================================ */

.ai-core {
    width: 42%;
    height: 42%;

    position: relative;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            #70efff 0%,
            #00bde9 22%,
            #05638d 48%,
            #021a2c 72%,
            #000811 100%
        );

    border:
        2px solid rgba(180,250,255,.9);

    box-shadow:
        0 0 25px var(--state),
        0 0 70px rgba(0,150,255,.45),
        inset 0 0 35px rgba(255,255,255,.20);

    animation:
        corePulse 3s ease-in-out infinite;

    transition:
        box-shadow .3s,
        animation-duration .4s;
}

.ai-core::before {
    content: "";

    position: absolute;

    inset: 10%;

    border-radius: 50%;

    border:
        1px solid rgba(255,255,255,.5);

    animation:
        innerPulse 2s ease-in-out infinite;
}

.ai-core::after {
    content: "";

    position: absolute;

    inset: 22%;

    border-radius: 50%;

    border:
        1px solid var(--state);

    box-shadow:
        0 0 12px var(--state);
}

@keyframes corePulse {

    0%,
    100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.045);
    }
}

@keyframes innerPulse {

    0%,
    100% {
        opacity: .4;
        transform: scale(.96);
    }

    50% {
        opacity: 1;
        transform: scale(1);
    }
}

.core-name {
    position: relative;

    z-index: 5;

    color: white;

    font-size:
        clamp(25px, 5vw, 44px);

    font-weight: 700;

    letter-spacing: 8px;

    text-shadow:
        0 0 10px white,
        0 0 25px var(--state);
}

.core-state {
    position: absolute;

    bottom: 27%;

    z-index: 6;

    color: var(--state);

    font-size: 9px;

    letter-spacing: 3px;

    text-shadow:
        0 0 9px var(--state);

    transition:
        color .25s;
}


/* ============================================================
   AUDIO WAVE
============================================================ */

.wave {
    position: absolute;

    width: 48%;
    height: 48%;

    border-radius: 50%;

    pointer-events: none;

    opacity: .0;

    transition:
        opacity .3s;
}

.wave span {
    position: absolute;

    left: 50%;
    top: 50%;

    width: 2px;
    height: 24px;

    background: var(--state);

    transform-origin:
        0 70px;

    box-shadow:
        0 0 7px var(--state);

    animation:
        wavePulse .8s ease-in-out infinite;
}

.wave span:nth-child(2) {
    transform:
        rotate(30deg);
    animation-delay: .08s;
}

.wave span:nth-child(3) {
    transform:
        rotate(60deg);
    animation-delay: .16s;
}

.wave span:nth-child(4) {
    transform:
        rotate(90deg);
    animation-delay: .24s;
}

.wave span:nth-child(5) {
    transform:
        rotate(120deg);
    animation-delay: .32s;
}

.wave span:nth-child(6) {
    transform:
        rotate(150deg);
    animation-delay: .40s;
}

.wave span:nth-child(7) {
    transform:
        rotate(180deg);
    animation-delay: .48s;
}

.wave span:nth-child(8) {
    transform:
        rotate(210deg);
    animation-delay: .56s;
}

.wave span:nth-child(9) {
    transform:
        rotate(240deg);
    animation-delay: .64s;
}

.wave span:nth-child(10) {
    transform:
        rotate(270deg);
    animation-delay: .72s;
}

.wave span:nth-child(11) {
    transform:
        rotate(300deg);
    animation-delay: .80s;
}

.wave span:nth-child(12) {
    transform:
        rotate(330deg);
    animation-delay: .88s;
}

@keyframes wavePulse {

    0%,
    100% {
        height: 13px;
    }

    50% {
        height: 35px;
    }
}


/* ============================================================
   CHAT
============================================================ */

.chat {
    position: absolute;

    left: 50%;
    bottom: 92px;

    transform:
        translateX(-50%);

    width:
        min(560px, 88%);

    max-height: 145px;

    overflow-y: auto;

    z-index: 8;

    scrollbar-width: thin;
}

.message {
    display: flex;

    margin: 6px 0;
}

.message.user {
    justify-content: flex-end;
}

.bubble {
    max-width: 85%;

    padding: 9px 13px;

    border:
        1px solid rgba(0,217,255,.2);

    background:
        rgba(1,12,20,.84);

    backdrop-filter:
        blur(10px);

    font-size: 12px;

    line-height: 1.45;
}

.message.user .bubble {
    border-color:
        rgba(0,217,255,.4);

    background:
        rgba(0,80,110,.45);
}

a {
    color: #65e7ff;
}


/* ============================================================
   ACTION BUTTON
============================================================ */

.action-button {
    display: block;

    margin-top: 7px;

    padding: 7px 11px;

    border:
        1px solid var(--state);

    background:
        rgba(0,80,110,.4);

    color: #8beeff;

    cursor: pointer;

    font-size: 10px;

    transition:
        .2s;
}

.action-button:hover {
    background:
        rgba(0,150,200,.35);

    box-shadow:
        0 0 12px rgba(0,217,255,.25);
}


/* ============================================================
   COMMAND BAR
============================================================ */

.command-bar {
    position: absolute;

    bottom: 20px;

    left: 50%;

    transform:
        translateX(-50%);

    width:
        min(650px, 92%);

    display: flex;

    gap: 8px;

    z-index: 20;
}

input {
    flex: 1;

    height: 46px;

    border:
        1px solid rgba(0,217,255,.35);

    outline: none;

    background:
        rgba(0,10,18,.92);

    color: white;

    padding:
        0 15px;

    font-size: 13px;

    backdrop-filter:
        blur(10px);
}

input:focus {
    border-color:
        var(--state);

    box-shadow:
        0 0 18px rgba(0,217,255,.15);
}

.command-button {
    width: 48px;

    border:
        1px solid rgba(0,217,255,.45);

    background:
        rgba(0,50,70,.75);

    color: white;

    font-size: 18px;

    cursor: pointer;

    transition:
        .2s;
}

.command-button:hover {
    background:
        rgba(0,120,160,.65);

    box-shadow:
        0 0 15px rgba(0,217,255,.25);
}

.mic.listening {
    background:
        rgba(190,20,60,.75);

    border-color:
        #ff1744;

    box-shadow:
        0 0 20px rgba(255,23,68,.45);
}

/* ============================================================
   RED ACCENT
============================================================ */

.red-accent {
    color: #ff1744;
    border-color: #ff1744;
    text-shadow: 0 0 10px rgba(255,23,68,.7);
}

.stop-voice {
    color: #ff4268;
    border-color: rgba(255,66,104,.55);
}

.stop-voice:hover {
    background: rgba(190,20,60,.55);
    border-color: #ff4268;
    box-shadow: 0 0 15px rgba(255,66,104,.30);
}



/* ============================================================
   AJAY SIGNATURE
============================================================ */

.creator-signature {
    position: fixed;

    right: 24px;
    bottom: 24px;

    width: 150px;
    height: auto;

    opacity: .72;

    z-index: 25;

    pointer-events: none;

    filter:
        drop-shadow(0 0 5px rgba(0,217,255,.35))
        drop-shadow(0 0 9px rgba(255,23,68,.18));

    transition:
        opacity .25s,
        transform .25s;
}

.creator-signature:hover {
    opacity: .95;
    transform: scale(1.03);
}

.creator-signature-label {
    position: fixed;

    right: 28px;
    bottom: 10px;

    color: #57899b;

    font-size: 7px;
    letter-spacing: 2px;

    z-index: 25;

    pointer-events: none;

    text-transform: uppercase;
}

/* ============================================================
   MOBILE
============================================================ */

@media (max-width: 700px) {


    .creator-signature {
        right: 12px;
        bottom: 72px;
        width: 105px;
    }

    .creator-signature-label {
        right: 14px;
        bottom: 58px;
        font-size: 6px;
    }

    .topbar {
        height: 62px;
        padding: 0 12px;
    }

    .brand-title {
        font-size: 15px;
        letter-spacing: 3px;
    }

    .brand-sub {
        font-size: 7px;
    }

    .system-status {
        font-size: 8px;
    }

    .side-panel {
        display: none;
    }

    .core-system {
        width: 88vw;
        height: 88vw;

        max-width: 380px;
        max-height: 380px;
    }

    .chat {
        bottom: 82px;
        max-height: 135px;
    }

    .command-bar {
        bottom: 10px;
    }

    .wave span {
        transform-origin:
            0 58px;
    }
}

</style>
</head>


<body>

<div class="grid"></div>
<div class="scanlines"></div>

<img
    class="creator-signature"
    src="/static/images/ajay_signature_transparent.png"
    alt="Ajay Bollipo signature"
>

<div class="creator-signature-label">
    CREATED BY AJAY BOLLIPO
</div>

<div class="app">


    <!-- =====================================================
         TOP BAR
    ====================================================== -->

    <div class="topbar">

        <div class="brand">

            <div class="brand-mark">
                AJ
            </div>

            <div>

                <div class="brand-title">
                    AJ
                </div>

                <div class="brand-sub">
                    PERSONAL INTELLIGENCE SYSTEM
                </div>

            </div>

        </div>


        <div class="system-status">

            <span
                class="status-dot"
                id="statusDot">
            </span>

            <span id="statusText">
                ONLINE
            </span>

        </div>

    </div>


    <!-- =====================================================
         HUD
    ====================================================== -->

    <div class="hud-area">


        <!-- LEFT PANEL -->

        <div class="side-panel left">

            <div class="panel-title">
                SYSTEM
            </div>

            <div class="data-row">
                <span>CORE</span>
                <span class="data-value">ACTIVE</span>
            </div>

            <div class="data-row">
                <span>MEMORY</span>
                <span class="data-value">ONLINE</span>
            </div>

            <div class="data-row">
                <span>SEARCH</span>
                <span class="data-value">READY</span>
            </div>

            <div class="data-row">
                <span>VOICE</span>
                <span class="data-value">READY</span>
            </div>

            <div class="graph">
                <div class="graph-line"></div>
            </div>

        </div>


        <!-- RIGHT PANEL -->

        <div class="side-panel right">

            <div class="panel-title">
                ACTIVITY
            </div>

            <div class="data-row">
                <span>ENGINE</span>
                <span class="data-value">AI</span>
            </div>

            <div class="data-row">
                <span>NETWORK</span>
                <span class="data-value">CONNECTED</span>
            </div>

            <div class="data-row">
                <span>TOOLS</span>
                <span class="data-value">READY</span>
            </div>

            <div class="data-row">
                <span>MODE</span>
                <span class="data-value">AJ</span>
            </div>

            <div class="graph">
                <div class="graph-line"></div>
            </div>

        </div>


        <!-- =================================================
             CENTRAL AI CORE
        ================================================== -->

        <div
            class="core-system"
            id="coreSystem">


            <div class="ring one"></div>

            <div class="ring two"></div>

            <div class="ring three"></div>

            <div class="ring four"></div>


            <div class="marker-ring">

                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>

            </div>


            <div
                class="scanner"
                id="scanner">
            </div>


            <!-- AUDIO WAVE -->

            <div
                class="wave"
                id="wave">

                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>

            </div>


            <!-- CORE -->

            <div
                class="ai-core"
                id="aiCore">

                <div class="core-name">
                    AJ
                </div>

                <div
                    class="core-state"
                    id="coreState">
                    ONLINE
                </div>

            </div>

        </div>


        <!-- CHAT -->

        <div
            class="chat"
            id="chat">

            <div class="message">

                <div class="bubble">

                    AJ online.
                    Awaiting your command.

                </div>

            </div>

        </div>

    </div>


    <!-- =====================================================
         COMMAND BAR
    ====================================================== -->

    <div class="command-bar">

        <input
            id="messageInput"
            type="text"
            placeholder="Speak or enter a command..."
            autocomplete="off"
        >

        <button
            class="command-button mic"
            id="micButton"
            title="Voice input">

            🎤

        </button>

        <button
            class="command-button stop-voice"
            id="stopVoiceButton"
            title="Stop voice">

            ■

        </button>

        <button
            class="command-button"
            id="sendButton"
            title="Send">

            ➤

        </button>

    </div>

</div>


<script>

/* ============================================================
   ELEMENTS
============================================================ */

const input =
    document.getElementById(
        "messageInput"
    );

const sendButton =
    document.getElementById(
        "sendButton"
    );

const micButton =
    document.getElementById(
        "micButton"
    );

const stopVoiceButton =
    document.getElementById(
        "stopVoiceButton"
    );

const chat =
    document.getElementById(
        "chat"
    );

const statusText =
    document.getElementById(
        "statusText"
    );

const statusDot =
    document.getElementById(
        "statusDot"
    );

const coreState =
    document.getElementById(
        "coreState"
    );

const aiCore =
    document.getElementById(
        "aiCore"
    );

const scanner =
    document.getElementById(
        "scanner"
    );

const wave =
    document.getElementById(
        "wave"
    );

const coreSystem =
    document.getElementById(
        "coreSystem"
    );

const rings =
    document.querySelectorAll(
        ".ring"
    );


let history = [];

let recognition = null;

let listening = false;


/* ============================================================
   STATE COLORS
============================================================ */

const stateColors = {

    ONLINE:
        "#00ff9d",

    LISTENING:
        "#00d9ff",

    THINKING:
        "#ffd166",

    SEARCHING:
        "#a978ff",

    EXECUTING:
        "#ff9f43",

    SPEAKING:
        "#00e5ff",

    ERROR:
        "#ff1744",

    RED:
        "#ff1744"

};


/* ============================================================
   SET AJ STATE
============================================================ */

function setStatus(state) {

    const color =
        stateColors[state]
        || stateColors.ONLINE;


    statusText.textContent =
        state;

    coreState.textContent =
        state;


    document.documentElement
        .style
        .setProperty(
            "--state",
            color
        );


    statusDot.style.background =
        color;

    statusDot.style.boxShadow =
        `0 0 14px ${color}`;


    coreState.style.color =
        color;


    /* ========================================
       DEFAULT
    ======================================== */

    aiCore.style.animationDuration =
        "3s";

    scanner.style.animationDuration =
        "5s";

    wave.style.opacity =
        "0";


    rings.forEach(
        ring => {

            ring.style.animationDuration =
                "";

        }
    );


    /* ========================================
       LISTENING
    ======================================== */

    if (state === "LISTENING") {

        aiCore.style.animationDuration =
            "0.65s";

        scanner.style.animationDuration =
            "1.3s";

        wave.style.opacity =
            "1";

        rings.forEach(
            ring => {

                ring.style.animationDuration =
                    "3s";

            }
        );
    }


    /* ========================================
       THINKING
    ======================================== */

    else if (state === "THINKING") {

        aiCore.style.animationDuration =
            "1.1s";

        scanner.style.animationDuration =
            "2.3s";

        rings.forEach(
            ring => {

                ring.style.animationDuration =
                    "4s";

            }
        );
    }


    /* ========================================
       SEARCHING
    ======================================== */

    else if (state === "SEARCHING") {

        aiCore.style.animationDuration =
            "0.85s";

        scanner.style.animationDuration =
            "0.75s";

        rings.forEach(
            ring => {

                ring.style.animationDuration =
                    "2.3s";

            }
        );
    }


    /* ========================================
       EXECUTING
    ======================================== */

    else if (state === "EXECUTING") {

        aiCore.style.animationDuration =
            "0.55s";

        scanner.style.animationDuration =
            "0.45s";

        rings.forEach(
            ring => {

                ring.style.animationDuration =
                    "1.6s";

            }
        );
    }


    /* ========================================
       SPEAKING
    ======================================== */

    else if (state === "SPEAKING") {

        aiCore.style.animationDuration =
            "0.5s";

        scanner.style.animationDuration =
            "1s";

        wave.style.opacity =
            "1";

        rings.forEach(
            ring => {

                ring.style.animationDuration =
                    "2.8s";

            }
        );
    }


    /* ========================================
       ERROR
    ======================================== */

    else if (state === "ERROR") {

        aiCore.style.animationDuration =
            "0.25s";

        scanner.style.animationDuration =
            "0.3s";

        rings.forEach(
            ring => {

                ring.style.animationDuration =
                    "0.6s";

            }
        );
    }

}


/* ============================================================
   ADD MESSAGE
============================================================ */

function addMessage(
    sender,
    text,
    url = null
) {

    const message =
        document.createElement(
            "div"
        );

    message.className =
        "message " + sender;


    const bubble =
        document.createElement(
            "div"
        );

    bubble.className =
        "bubble";


    bubble.innerHTML =
        formatText(text);


    if (url) {

        // Open website directly instead of showing an "OPEN WEBSITE" button.
        // This works reliably on mobile browsers after AJ confirms the URL.
        setTimeout(function() {
            window.location.href = url;
        }, 100);
    }


    message.appendChild(
        bubble
    );

    chat.appendChild(
        message
    );


    chat.scrollTop =
        chat.scrollHeight;
}


/* ============================================================
   FORMAT RESPONSE
============================================================ */

function formatText(text) {

    let safe =
        String(text)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        );


    safe =
        safe.replace(
            /(https?:\/\/[^\s]+)/g,
            '<a href="$1" target="_blank">$1</a>'
        );


    return safe;
}


/* ============================================================
   SEND MESSAGE
============================================================ */

async function sendMessage() {

    const message =
        input.value.trim();


    if (!message) {
        return;
    }


    addMessage(
        "user",
        message
    );


    input.value =
        "";


    setStatus(
        "THINKING"
    );


    try {

        const response =
            await fetch(
                "/api/command",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        message:
                            message,

                        history:
                            history

                    })
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.response
                || "AJ request failed."
            );
        }


        /* ====================================
           HISTORY
        ==================================== */

        history.push({

            role:
                "user",

            content:
                message

        });


        history.push({

            role:
                "assistant",

            content:
                data.response

        });


        /* ====================================
           SERVER STATE
        ==================================== */

        setStatus(
            data.state
            || "ONLINE"
        );


        /* ====================================
           URL
        ==================================== */

        let url =
            null;


        const urlMatch =
            data.response &&
            data.response.match(
                /https?:\/\/[^\s]+/
            );


        if (urlMatch) {

            url =
                urlMatch[0]
                .replace(
                    /[.,)]$/,
                    ""
                );

        }


        /* ====================================
           AJ RESPONSE
        ==================================== */

        addMessage(
            "aj",
            data.response,
            url
        );


        /* ====================================
           SPEAK
        ==================================== */

        speak(
            data.response
            .replace(
                /https?:\/\/[^\s]+/g,
                ""
            )
        );


    }

    catch (error) {

        console.error(
            error
        );


        setStatus(
            "ERROR"
        );


        addMessage(
            "aj",
            "I encountered an error while processing that command."
        );


        setTimeout(
            function() {

                setStatus(
                    "ONLINE"
                );

            },
            1500
        );

    }

}


/* ============================================================
   ENTER KEY
============================================================ */

input.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key ===
            "Enter"
        ) {

            sendMessage();

        }

    }
);


/* ============================================================
   SEND BUTTON
============================================================ */

sendButton.onclick =
    sendMessage;


/* ============================================================
   VOICE RECOGNITION
============================================================ */

if (
    "webkitSpeechRecognition"
    in window
) {

    recognition =
        new webkitSpeechRecognition();


    recognition.lang =
        "en-IN";


    recognition.continuous =
        false;


    recognition.interimResults =
        false;


    recognition.onstart =
        function() {

            listening =
                true;


            micButton.classList.add(
                "listening"
            );


            setStatus(
                "LISTENING"
            );

        };


    recognition.onresult =
        function(event) {

            if (!listening) {
                return;
            }

            const text =
                event
                .results[0][0]
                .transcript;


            input.value =
                text;


            recognition.stop();

            listening = false;

            micButton.classList.remove(
                "listening"
            );

            setStatus(
                "THINKING"
            );

            sendMessage();

        };


    recognition.onerror =
        function() {

            listening =
                false;


            micButton.classList.remove(
                "listening"
            );


            setStatus(
                "ERROR"
            );


            setTimeout(
                function() {

                    setStatus(
                        "ONLINE"
                    );

                },
                1200
            );

        };


    recognition.onend =
        function() {

            listening =
                false;


            micButton.classList.remove(
                "listening"
            );

        };

}


/* ============================================================
   MIC BUTTON
============================================================ */

micButton.onclick =
    function() {

        if (!recognition) {

            addMessage(
                "aj",
                "Voice input is not supported by this browser."
            );

            return;
        }


        if (listening) {

            stopListening();

            return;

        }


        try {

            recognition.start();

        }

        catch (error) {

            console.log(
                error
            );

        }

    };


/* ============================================================
   STOP LISTENING
============================================================ */

function stopListening() {

    listening = false;

    if (recognition) {

        try {
            recognition.abort();
        }
        catch (error) {
            console.log(error);
        }

    }

    micButton.classList.remove(
        "listening"
    );

    setStatus(
        "ONLINE"
    );
}


/* ============================================================
   STOP VOICE OUTPUT
============================================================ */

function stopVoice() {

    stopListening();

    stopSpeaking();
}


stopVoiceButton.onclick =
    stopVoice;


/* ============================================================
   SPEECH
============================================================ */

function speak(text) {

    if (
        !("speechSynthesis" in window)
    ) {

        return;

    }


    speechSynthesis.cancel();


    const voice =
        new SpeechSynthesisUtterance(
            text
        );


    voice.lang =
        "en-IN";


    voice.rate =
        0.94;


    voice.pitch =
        0.88;


    voice.onstart =
        function() {

            setStatus(
                "SPEAKING"
            );

        };


    voice.onend =
        function() {

            setStatus(
                "ONLINE"
            );

        };


    speechSynthesis.speak(
        voice
    );

}


/* ============================================================
   STOP VOICE
============================================================ */

function stopSpeaking() {

    if (
        "speechSynthesis"
        in window
    ) {

        speechSynthesis.cancel();

    }


    setStatus(
        "ONLINE"
    );

}


/* ============================================================
   SERVER STATUS
============================================================ */

async function updateStatus() {

    try {

        const response =
            await fetch(
                "/api/status"
            );


        const data =
            await response.json();


        if (
            data &&
            data.state
        ) {

            /*
             * Do not overwrite an active
             * local SPEAKING/LISTENING state.
             */

            if (
                !listening &&
                speechSynthesis.speaking === false
            ) {

                setStatus(
                    data.state
                );

            }

        }

    }

    catch (error) {

        console.log(
            "AJ status unavailable"
        );

    }

}


/* ============================================================
   INITIALIZE
============================================================ */

setStatus(
    "ONLINE"
);


updateStatus();


setInterval(
    updateStatus,
    2000
);

</script>

</body>
</html>
