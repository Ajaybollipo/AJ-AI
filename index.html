<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AJ — Personal Intelligence System</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
    --cyan:#00d9ff;
    --blue:#168cff;
    --green:#00ff9d;
    --red:#ff1744;
    --bg:#000;
    --panel:rgba(2,12,20,.88);
    --line:rgba(0,217,255,.25);
    --state:#00ff9d;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:#000;
    color:#e9fbff;
    font-family:Arial,Helvetica,sans-serif;
}

button,input{font:inherit}

.app{
    width:100%;
    height:100vh;
    position:relative;
    overflow:hidden;
    background:#000;
}

/* TOP BAR */
.topbar{
    position:absolute;
    top:0;
    left:0;
    right:0;
    height:70px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 25px;
    border-bottom:1px solid rgba(0,217,255,.16);
    background:rgba(0,5,10,.72);
    backdrop-filter:blur(12px);
    z-index:30;
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
}

.brand-mark{
    width:40px;
    height:40px;
    display:flex;
    align-items:center;
    justify-content:center;
    border:1px solid var(--cyan);
    color:#fff;
    font-weight:700;
    letter-spacing:2px;
    box-shadow:0 0 18px rgba(0,217,255,.3);
}

.brand-title{
    font-size:18px;
    letter-spacing:5px;
}

.brand-sub{
    margin-top:3px;
    color:#56899b;
    font-size:8px;
    letter-spacing:2px;
}

.system-status{
    display:flex;
    align-items:center;
    gap:8px;
    padding:8px 12px;
    border:1px solid var(--line);
    color:#bceeff;
    font-size:9px;
    letter-spacing:2px;
}

.status-dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:var(--state);
    box-shadow:0 0 12px var(--state);
}

/* MAIN HUD */
.hud{
    position:absolute;
    inset:70px 0 0 0;
}

/* CORE */
.core-system{
    position:absolute;
    left:38%;
    top:43%;
    transform:translate(-50%,-50%);
    width:min(410px,42vw);
    aspect-ratio:1;
    display:flex;
    align-items:center;
    justify-content:center;
}

.ring{
    position:absolute;
    border-radius:50%;
    border:1px solid var(--line);
}

.ring.one{
    inset:0;
    border-top-color:var(--state);
    border-bottom-color:rgba(0,217,255,.06);
    animation:spin 18s linear infinite;
}

.ring.two{
    inset:7%;
    border-left-color:var(--state);
    border-right-color:rgba(0,217,255,.05);
    animation:spinReverse 13s linear infinite;
}

.ring.three{
    inset:17%;
    border:2px solid transparent;
    border-top-color:var(--state);
    border-bottom-color:rgba(0,217,255,.06);
    animation:spin 9s linear infinite;
}

.ring.four{
    inset:27%;
    border:2px dashed rgba(0,217,255,.45);
    animation:spinReverse 7s linear infinite;
}

.marker-ring{
    position:absolute;
    inset:3%;
    border-radius:50%;
    animation:spin 25s linear infinite;
}

.marker-ring span{
    position:absolute;
    left:50%;
    top:-5px;
    width:2px;
    height:12px;
    background:var(--state);
    box-shadow:0 0 8px var(--state);
    transform-origin:0 calc((min(410px,42vw) * .47));
}

.marker-ring span:nth-child(2){transform:rotate(45deg)}
.marker-ring span:nth-child(3){transform:rotate(90deg)}
.marker-ring span:nth-child(4){transform:rotate(135deg)}
.marker-ring span:nth-child(5){transform:rotate(180deg)}
.marker-ring span:nth-child(6){transform:rotate(225deg)}
.marker-ring span:nth-child(7){transform:rotate(270deg)}
.marker-ring span:nth-child(8){transform:rotate(315deg)}

.ai-core{
    width:42%;
    aspect-ratio:1;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    background:radial-gradient(circle,#7bf2ff 0%,#00bde9 24%,#05638d 48%,#021a2c 72%,#000811 100%);
    border:2px solid rgba(190,250,255,.9);
    box-shadow:0 0 25px var(--state),0 0 70px rgba(0,150,255,.4),inset 0 0 35px rgba(255,255,255,.2);
    animation:corePulse 3s ease-in-out infinite;
}

.ai-core:before{
    content:"";
    position:absolute;
    inset:10%;
    border-radius:50%;
    border:1px solid rgba(255,255,255,.55);
    animation:innerPulse 2s ease-in-out infinite;
}

.ai-core:after{
    content:"";
    position:absolute;
    inset:22%;
    border-radius:50%;
    border:1px solid var(--state);
    box-shadow:0 0 12px var(--state);
}

.core-name{
    position:relative;
    z-index:3;
    color:#fff;
    font-size:clamp(26px,4vw,45px);
    font-weight:700;
    letter-spacing:8px;
    text-shadow:0 0 10px #fff,0 0 25px var(--state);
}

.core-state{
    position:absolute;
    bottom:27%;
    z-index:5;
    color:var(--state);
    font-size:8px;
    letter-spacing:3px;
    text-shadow:0 0 9px var(--state);
}

/* SIGNATURE */
.creator{
    position:absolute;
    left:38%;
    top:calc(43% + min(205px,21vw));
    transform:translateX(-50%);
    text-align:center;
    z-index:12;
}

.creator img{
    width:125px;
    max-width:18vw;
    display:block;
    margin:auto;
    filter:drop-shadow(0 0 8px rgba(0,217,255,.25));
}

.creator-label{
    margin-top:3px;
    color:#527887;
    font-size:7px;
    letter-spacing:2px;
}

/* RESPONSE AREA — RIGHT SIDE ONLY */
.response-panel{
    position:absolute;
    right:32px;
    top:18%;
    width:min(500px,43vw);
    height:57%;
    min-height:250px;
    display:flex;
    flex-direction:column;
    border:1px solid rgba(0,217,255,.25);
    background:rgba(0,7,13,.82);
    box-shadow:0 0 30px rgba(0,0,0,.5),inset 0 0 25px rgba(0,217,255,.025);
    backdrop-filter:blur(12px);
    z-index:10;
}

.response-header{
    height:42px;
    flex:none;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 14px;
    border-bottom:1px solid rgba(0,217,255,.18);
}

.response-title{
    color:var(--cyan);
    font-size:9px;
    letter-spacing:3px;
}

.response-state{
    color:var(--state);
    font-size:8px;
    letter-spacing:2px;
}

.response-content{
    flex:1;
    overflow-y:auto;
    padding:14px;
    scrollbar-width:thin;
}

.response-empty{
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#355866;
    text-align:center;
    font-size:10px;
    letter-spacing:2px;
}

.response-block{
    margin-bottom:14px;
}

.response-user{
    color:#6994a2;
    font-size:8px;
    letter-spacing:2px;
    margin-bottom:5px;
}

.response-user-text{
    color:#9eeeff;
    font-size:11px;
    line-height:1.5;
    margin-bottom:10px;
}

.response-aj{
    border-left:2px solid var(--cyan);
    padding:10px 12px;
    background:rgba(0,40,58,.38);
    color:#effcff;
    font-size:12px;
    line-height:1.6;
    white-space:pre-wrap;
    overflow-wrap:anywhere;
    box-shadow:inset 12px 0 25px rgba(0,217,255,.025);
}

/* INPUT */
.command-bar{
    position:absolute;
    left:38%;
    bottom:22px;
    transform:translateX(-50%);
    width:min(560px,48vw);
    display:flex;
    gap:7px;
    z-index:25;
}

#messageInput{
    flex:1;
    min-width:0;
    height:44px;
    padding:0 13px;
    border:1px solid rgba(0,217,255,.35);
    outline:none;
    background:rgba(0,9,15,.95);
    color:#fff;
    font-size:12px;
}

#messageInput:focus{
    border-color:var(--cyan);
    box-shadow:0 0 16px rgba(0,217,255,.12);
}

.command-button{
    width:47px;
    height:44px;
    border:1px solid rgba(0,217,255,.3);
    background:rgba(0,30,43,.8);
    color:#9feeff;
    cursor:pointer;
    transition:.2s;
}

.command-button:hover{
    border-color:var(--cyan);
    box-shadow:0 0 14px rgba(0,217,255,.2);
}

.command-button.voice{
    width:75px;
}

.command-button.voice.listening{
    color:#fff;
    border-color:var(--green);
    box-shadow:0 0 18px rgba(0,255,157,.25);
    animation:voicePulse 1s infinite;
}

.command-button.stop{
    color:#ff7b91;
    border-color:rgba(255,23,68,.35);
}

.command-button.history{
    width:95px;
}

/* VOICE STATUS */
.voice-status{
    position:absolute;
    left:38%;
    top:9%;
    transform:translateX(-50%);
    color:#557d8b;
    font-size:8px;
    letter-spacing:3px;
    z-index:20;
}

.voice-status.listening{color:var(--green);text-shadow:0 0 10px var(--green)}
.voice-status.speaking{color:var(--cyan);text-shadow:0 0 10px var(--cyan)}
.voice-status.error{color:#ff6179}

/* HISTORY DRAWER */
.history-backdrop{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.48);
    opacity:0;
    pointer-events:none;
    transition:.25s;
    z-index:90;
}

.history-backdrop.open{
    opacity:1;
    pointer-events:auto;
}

.history-panel{
    position:fixed;
    top:0;
    right:0;
    width:min(390px,90vw);
    height:100vh;
    background:rgba(0,7,13,.98);
    border-left:1px solid rgba(0,217,255,.3);
    box-shadow:-20px 0 60px rgba(0,0,0,.6);
    transform:translateX(100%);
    transition:transform .28s ease;
    z-index:100;
    display:flex;
    flex-direction:column;
}

.history-panel.open{
    transform:translateX(0);
}

.history-head{
    height:65px;
    flex:none;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 16px;
    border-bottom:1px solid rgba(0,217,255,.2);
}

.history-title{
    color:var(--cyan);
    font-size:11px;
    letter-spacing:3px;
}

.history-close{
    width:34px;
    height:34px;
    border:1px solid rgba(255,23,68,.35);
    background:transparent;
    color:#ff7188;
    cursor:pointer;
}

.history-list{
    flex:1;
    overflow-y:auto;
    padding:14px;
}

.history-empty{
    color:#456875;
    font-size:10px;
    letter-spacing:1px;
    text-align:center;
    margin-top:40px;
}

.history-item{
    margin-bottom:13px;
    padding:10px;
    border:1px solid rgba(0,217,255,.12);
    background:rgba(0,20,30,.5);
}

.history-role{
    color:var(--cyan);
    font-size:8px;
    letter-spacing:2px;
    margin-bottom:5px;
}

.history-item.user .history-role{color:#7794a0}
.history-text{
    color:#dff9ff;
    font-size:11px;
    line-height:1.45;
    white-space:pre-wrap;
    overflow-wrap:anywhere;
}

.history-footer{
    padding:12px;
    border-top:1px solid rgba(0,217,255,.15);
}

.clear-history{
    width:100%;
    height:38px;
    border:1px solid rgba(255,23,68,.35);
    background:rgba(60,0,12,.25);
    color:#ff7188;
    cursor:pointer;
    font-size:9px;
    letter-spacing:2px;
}

/* ANIMATION */
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinReverse{to{transform:rotate(-360deg)}}
@keyframes corePulse{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
@keyframes innerPulse{0%,100%{opacity:.4;transform:scale(.96)}50%{opacity:1;transform:scale(1)}}
@keyframes voicePulse{50%{transform:scale(1.04)}}

/* MOBILE */
@media(max-width:800px){
    .topbar{height:58px;padding:0 12px}
    .brand-title{font-size:13px;letter-spacing:3px}
    .brand-sub{font-size:6px}
    .brand-mark{width:34px;height:34px}
    .system-status{font-size:7px;padding:6px 8px}

    .hud{inset:58px 0 0}

    .core-system{
        left:50%;
        top:29%;
        width:250px;
    }

    .creator{
        left:50%;
        top:calc(29% + 130px);
    }

    .creator img{width:95px;max-width:none}

    .voice-status{
        left:50%;
        top:7%;
    }

    .response-panel{
        left:10px;
        right:10px;
        top:50%;
        width:auto;
        height:31%;
        min-height:170px;
    }

    .command-bar{
        left:10px;
        right:10px;
        bottom:10px;
        transform:none;
        width:auto;
    }

    .command-button.voice{width:62px}
    .command-button.history{width:76px}
    .command-button{width:42px}

    #messageInput{font-size:11px}
}

@media(max-width:500px){
    .brand-sub{display:none}
    .response-panel{top:48%;height:34%}
    .core-system{top:27%;width:215px}
    .creator{top:calc(27% + 112px)}
    .command-bar{gap:4px}
    .command-button.voice{font-size:0}
    .command-button.voice::after{content:"🎙";font-size:16px}
    .command-button.stop{font-size:0}
    .command-button.stop::after{content:"■";font-size:14px}
    .command-button.history{font-size:0}
    .command-button.history::after{content:"📜";font-size:15px}
}
</style>
</head>

<body>

<div class="app">

    <div class="topbar">
        <div class="brand">
            <div class="brand-mark">AJ</div>
            <div>
                <div class="brand-title">AJ</div>
                <div class="brand-sub">PERSONAL INTELLIGENCE SYSTEM</div>
            </div>
        </div>

        <div class="system-status">
            <span class="status-dot" id="statusDot"></span>
            <span id="topStatus">ONLINE</span>
        </div>
    </div>

    <div class="hud">

        <div class="voice-status" id="voiceStatus">
            INITIALIZING VOICE...
        </div>

        <!-- CENTRAL AJ CORE -->
        <div class="core-system">

            <div class="ring one"></div>
            <div class="ring two"></div>
            <div class="ring three"></div>
            <div class="ring four"></div>

            <div class="marker-ring">
                <span></span><span></span><span></span><span></span>
                <span></span><span></span><span></span><span></span>
            </div>

            <div class="ai-core">
                <div class="core-name">AJ</div>
            </div>

            <div class="core-state" id="coreState">
                LISTENING
            </div>
        </div>

        <!-- SIGNATURE -->
        <div class="creator">
            <img src="/static/images/ajay_signature_transparent.png"
                 alt="Ajay Bollipo signature">
            <div class="creator-label">CREATED BY AJAY BOLLIPO</div>
        </div>

        <!-- RIGHT-SIDE ANSWERS ONLY -->
        <section class="response-panel">

            <div class="response-header">
                <div class="response-title">AJ RESPONSE</div>
                <div class="response-state" id="responseState">READY</div>
            </div>

            <div class="response-content" id="responseContent">
                <div class="response-empty" id="responseEmpty">
                    ASK AJ SOMETHING
                </div>
            </div>

        </section>

        <!-- COMMAND BAR -->
        <div class="command-bar">

            <input
                id="messageInput"
                type="text"
                placeholder="Talk to AJ..."
                autocomplete="off"
            >

            <button
                class="command-button voice"
                id="micButton"
                type="button"
                title="Voice input">
                🎙 VOICE
            </button>

            <button
                class="command-button"
                id="sendButton"
                type="button"
                title="Send">
                ▶
            </button>

            <button
                class="command-button stop"
                id="stopVoiceButton"
                type="button"
                title="Stop voice">
                ■
            </button>

            <button
                class="command-button history"
                id="historyButton"
                type="button"
                title="History">
                📜 HISTORY
            </button>

        </div>
    </div>
</div>

<!-- HISTORY BACKDROP -->
<div class="history-backdrop" id="historyBackdrop"></div>

<!-- HISTORY DRAWER -->
<aside class="history-panel" id="historyPanel">

    <div class="history-head">
        <div class="history-title">CHAT HISTORY</div>
        <button class="history-close" id="historyClose">✕</button>
    </div>

    <div class="history-list" id="historyList">
        <div class="history-empty">
            NO CONVERSATION HISTORY
        </div>
    </div>

    <div class="history-footer">
        <button class="clear-history" id="clearHistory">
            CLEAR HISTORY
        </button>
    </div>

</aside>

<script>
/* ============================================================
   ELEMENTS
============================================================ */

const input = document.getElementById("messageInput");
const sendButton = document.getElementById("sendButton");
const micButton = document.getElementById("micButton");
const stopVoiceButton = document.getElementById("stopVoiceButton");
const historyButton = document.getElementById("historyButton");

const voiceStatus = document.getElementById("voiceStatus");
const coreState = document.getElementById("coreState");
const topStatus = document.getElementById("topStatus");
const statusDot = document.getElementById("statusDot");
const responseState = document.getElementById("responseState");
const responseContent = document.getElementById("responseContent");
const responseEmpty = document.getElementById("responseEmpty");

const historyPanel = document.getElementById("historyPanel");
const historyBackdrop = document.getElementById("historyBackdrop");
const historyClose = document.getElementById("historyClose");
const historyList = document.getElementById("historyList");
const clearHistoryButton = document.getElementById("clearHistory");


/* ============================================================
   STATE
============================================================ */

let recognition = null;
let listening = false;
let speaking = false;
let processing = false;
let shouldKeepListening = false;
let voiceActive = false;
let restartTimer = null;
let microphoneStream = null;

let history = [];


/* ============================================================
   STATUS
============================================================ */

function setStatus(state) {
    const value = String(state || "ONLINE").toUpperCase();

    topStatus.textContent = value;
    coreState.textContent = value;

    if (value === "ERROR") {
        statusDot.style.background = "#ff1744";
        statusDot.style.boxShadow = "0 0 12px #ff1744";
    } else if (value === "THINKING" || value === "SEARCHING" || value === "EXECUTING") {
        statusDot.style.background = "#00d9ff";
        statusDot.style.boxShadow = "0 0 12px #00d9ff";
    } else {
        statusDot.style.background = "var(--state)";
        statusDot.style.boxShadow = "0 0 12px var(--state)";
    }
}

function setVoiceStatus(text, type="") {
    voiceStatus.textContent = text;
    voiceStatus.className = "voice-status " + type;
}


/* ============================================================
   RESPONSE DISPLAY
   AJ ANSWERS ARE SHOWN ONLY IN THE RIGHT PANEL
============================================================ */

function escapeHTML(text) {
    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
}

function addResponse(userText, ajText) {

    responseEmpty?.remove();

    const block = document.createElement("div");
    block.className = "response-block";

    const userLabel = document.createElement("div");
    userLabel.className = "response-user";
    userLabel.textContent = "YOU";

    const userMessage = document.createElement("div");
    userMessage.className = "response-user-text";
    userMessage.textContent = userText;

    const ajMessage = document.createElement("div");
    ajMessage.className = "response-aj";
    ajMessage.textContent = ajText;

    block.appendChild(userLabel);
    block.appendChild(userMessage);
    block.appendChild(ajMessage);

    responseContent.appendChild(block);
    responseContent.scrollTop = responseContent.scrollHeight;
}

function showThinking() {
    responseState.textContent = "THINKING";
}

function showReady() {
    responseState.textContent = "READY";
}


/* ============================================================
   HISTORY
============================================================ */

function renderHistory() {

    historyList.innerHTML = "";

    if (!history.length) {
        const empty = document.createElement("div");
        empty.className = "history-empty";
        empty.textContent = "NO CONVERSATION HISTORY";
        historyList.appendChild(empty);
        return;
    }

    history.forEach(item => {

        const row = document.createElement("div");
        row.className =
            "history-item " +
            (item.role === "user" ? "user" : "assistant");

        const role = document.createElement("div");
        role.className = "history-role";
        role.textContent =
            item.role === "user" ? "YOU" : "AJ";

        const text = document.createElement("div");
        text.className = "history-text";
        text.textContent = item.content;

        row.appendChild(role);
        row.appendChild(text);
        historyList.appendChild(row);
    });
}

function openHistory() {
    renderHistory();
    historyPanel.classList.add("open");
    historyBackdrop.classList.add("open");
}

function closeHistory() {
    historyPanel.classList.remove("open");
    historyBackdrop.classList.remove("open");
}

historyButton.addEventListener("click", openHistory);
historyClose.addEventListener("click", closeHistory);
historyBackdrop.addEventListener("click", closeHistory);

clearHistoryButton.addEventListener("click", function() {
    history = [];
    renderHistory();
});


/* ============================================================
   SPEECH OUTPUT
============================================================ */

function speak(text) {

    if (!("speechSynthesis" in window)) {
        setVoiceStatus("VOICE OUTPUT NOT SUPPORTED", "error");
        return;
    }

    const cleanText = String(text)
        .replace(/https?:\/\/\S+/g, "")
        .replace(/[*#_`]/g, "")
        .trim();

    if (!cleanText) {
        scheduleListening();
        return;
    }

    window.speechSynthesis.cancel();

    const utterance =
        new SpeechSynthesisUtterance(cleanText);

    utterance.lang = "en-IN";
    utterance.rate = 0.96;
    utterance.pitch = 0.95;
    utterance.volume = 1;

    utterance.onstart = function() {
        speaking = true;
        setVoiceStatus("AJ SPEAKING", "speaking");
        setStatus("SPEAKING");
    };

    utterance.onend = function() {
        speaking = false;

        if (shouldKeepListening && !processing) {
            setStatus("LISTENING");
            scheduleListening();
        } else {
            setStatus("ONLINE");
            setVoiceStatus("VOICE READY");
        }
    };

    utterance.onerror = function() {
        speaking = false;
        setStatus("ONLINE");
        setVoiceStatus("VOICE READY");
    };

    window.speechSynthesis.speak(utterance);
}

function stopSpeaking() {

    if ("speechSynthesis" in window) {
        window.speechSynthesis.cancel();
    }

    speaking = false;
    setStatus("ONLINE");
    setVoiceStatus("VOICE READY");
}


/* ============================================================
   VOICE INPUT
============================================================ */

function setupRecognition() {

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
        recognition = null;
        setVoiceStatus("USE CHROME FOR VOICE", "error");
        return false;
    }

    recognition = new SpeechRecognition();

    recognition.lang = "en-IN";
    recognition.continuous = false;
    recognition.interimResults = true;
    recognition.maxAlternatives = 1;

    recognition.onstart = function() {
        listening = true;
        micButton.classList.add("listening");
        setVoiceStatus("LISTENING...", "listening");
        setStatus("LISTENING");
    };

    recognition.onresult = function(event) {

        let transcript = "";

        for (let i = event.resultIndex; i < event.results.length; i++) {
            transcript += event.results[i][0].transcript;
        }

        transcript = transcript.trim();
        input.value = transcript;

        if (!event.results[event.results.length - 1].isFinal) {
            setVoiceStatus("HEARING: " + transcript, "listening");
            return;
        }

        if (!transcript) {
            return;
        }

        listening = false;

        try {
            recognition.stop();
        } catch (error) {}

        sendMessage();
    };

    recognition.onerror = function(event) {

        listening = false;
        micButton.classList.remove("listening");

        if (event.error === "not-allowed" ||
            event.error === "service-not-allowed") {

            shouldKeepListening = false;
            setVoiceStatus(
                "MICROPHONE PERMISSION REQUIRED",
                "error"
            );
            setStatus("ONLINE");
            return;
        }

        if (event.error === "no-speech") {
            setVoiceStatus("NO SPEECH — LISTENING AGAIN");
        } else {
            setVoiceStatus("VOICE READY");
        }

        if (shouldKeepListening &&
            !processing &&
            !speaking) {

            scheduleListening();
        }
    };

    recognition.onend = function() {

        listening = false;
        micButton.classList.remove("listening");

        if (shouldKeepListening &&
            !processing &&
            !speaking) {

            scheduleListening();
        }
    };

    return true;
}

async function requestMicrophonePermission() {

    if (!navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia) {

        setVoiceStatus("MICROPHONE API NOT AVAILABLE", "error");
        return false;
    }

    try {

        if (!microphoneStream) {

            microphoneStream =
                await navigator.mediaDevices.getUserMedia({
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true
                    }
                });
        }

        return true;

    } catch (error) {

        console.error("Microphone permission:", error);

        if (error.name === "NotAllowedError" ||
            error.name === "PermissionDeniedError") {

            setVoiceStatus(
                "ALLOW MICROPHONE IN CHROME",
                "error"
            );

        } else if (error.name === "NotFoundError") {

            setVoiceStatus(
                "NO MICROPHONE FOUND",
                "error"
            );

        } else {

            setVoiceStatus(
                "MICROPHONE ERROR",
                "error"
            );
        }

        setStatus("ONLINE");
        return false;
    }
}

async function startListening() {

    if (!recognition) {
        return;
    }

    if (listening || processing || speaking) {
        return;
    }

    const microphoneReady =
        await requestMicrophonePermission();

    if (!microphoneReady) {
        shouldKeepListening = false;
        voiceActive = false;
        return;
    }

    try {

        recognition.start();

    } catch (error) {

        console.log("Recognition start:", error);

        if (voiceActive &&
            shouldKeepListening &&
            !listening) {

            clearTimeout(restartTimer);

            restartTimer = setTimeout(
                function() {
                    startListening();
                },
                500
            );
        }
    }
}

function stopListening() {

    listening = false;
    clearTimeout(restartTimer);

    if (recognition) {
        try {
            recognition.abort();
        } catch (error) {}
    }

    if (microphoneStream) {

        microphoneStream
            .getTracks()
            .forEach(function(track) {
                track.stop();
            });

        microphoneStream = null;
    }

    micButton.classList.remove("listening");
    setVoiceStatus("VOICE READY");
}

function scheduleListening() {

    clearTimeout(restartTimer);

    if (!voiceActive || !shouldKeepListening ||
        processing ||
        speaking ||
        listening) {

        return;
    }

    restartTimer = setTimeout(function() {
        startListening();
    }, 800);
}

micButton.addEventListener("click", async function() {

    if (!recognition) {
        setVoiceStatus("USE CHROME FOR VOICE", "error");
        return;
    }

    if (listening) {
        shouldKeepListening = false;
        voiceActive = false;
        stopListening();
        return;
    }

    shouldKeepListening = true;
    voiceActive = true;

    setVoiceStatus("CHECKING MICROPHONE...");

    const microphoneReady =
        await requestMicrophonePermission();

    if (!microphoneReady) {
        shouldKeepListening = false;
        voiceActive = false;
        return;
    }

    setVoiceStatus("STARTING VOICE...");

    startListening();
});

stopVoiceButton.addEventListener("click", function() {
    shouldKeepListening = false;
    voiceActive = false;
    stopListening();
    stopSpeaking();
    setStatus("ONLINE");
    setVoiceStatus("VOICE STOPPED");
});


/* ============================================================
   SEND MESSAGE
============================================================ */

async function sendMessage() {

    const message = input.value.trim();

    if (!message || processing) {
        return;
    }

    processing = true;

    stopListening();
    showThinking();
    setStatus("THINKING");
    setVoiceStatus("AJ THINKING");

    input.value = "";

    try {

        const response = await fetch("/api/command", {
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                message:message,
                history:history
            })
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(
                data.response || "AJ request failed."
            );
        }

        const answer =
            data.response ||
            "I received your request.";

        history.push({
            role:"user",
            content:message
        });

        history.push({
            role:"assistant",
            content:answer
        });

        addResponse(message, answer);

        setStatus(data.state || "ONLINE");

        processing = false;

        /* AJ SPEAKS EVERY ANSWER */
        speak(answer);

    } catch (error) {

        console.error("AJ:", error);

        const errorText =
            "I encountered an error while processing that command.";

        addResponse(message, errorText);

        history.push({
            role:"user",
            content:message
        });

        history.push({
            role:"assistant",
            content:errorText
        });

        processing = false;

        setStatus("ERROR");
        setVoiceStatus("AJ ERROR", "error");

        setTimeout(function() {
            setStatus("ONLINE");

            if (shouldKeepListening) {
                scheduleListening();
            }
        }, 1200);
    }
}


/* ============================================================
   ENTER KEY
============================================================ */

input.addEventListener("keydown", function(event) {

    if (event.key === "Enter") {
        event.preventDefault();
        sendMessage();
    }
});

sendButton.addEventListener("click", sendMessage);


/* ============================================================
   STATUS FROM SERVER
============================================================ */

async function updateServerStatus() {

    try {

        const response =
            await fetch("/api/status");

        if (!response.ok) {
            return;
        }

        const data =
            await response.json();

        if (!listening &&
            !speaking &&
            !processing) {

            setStatus(data.state || "ONLINE");
        }

    } catch (error) {
        console.log("AJ status unavailable");
    }
}


/* ============================================================
   START AJ
============================================================ */

function initializeAJ() {

    setStatus("ONLINE");
    setVoiceStatus("INITIALIZING VOICE...");

    const supported =
        setupRecognition();

    if (!supported) {
        setStatus("ONLINE");
        return;
    }

    setVoiceStatus("VOICE READY");

    /* Microphone starts only after the user presses VOICE.
       This avoids Chrome blocking speech recognition before
       a user gesture/permission has been granted. */
    shouldKeepListening = false;
    voiceActive = false;
    setVoiceStatus("PRESS VOICE TO START");
}


/* ============================================================
   FIRST-INTERACTION FALLBACK
============================================================ */

document.addEventListener("click", function() {

    if (!recognition) {
        return;
    }

    /* Do not start the microphone from a generic page click.
       Speech recognition must be started by the VOICE button. */

}, {passive:true});


/* ============================================================
   PAGE LOAD
============================================================ */

window.addEventListener("load", function() {

    initializeAJ();

    updateServerStatus();

    setInterval(
        updateServerStatus,
        3000
    );
});

</script>
