<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AJ</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
    --cyan:#00d9ff;
    --blue:#168cff;
    --green:#00ff9d;
    --red:#ff1744;
    --bg:#000;
    --panel:rgba(2,12,20,.88);
    --line:rgba(0,217,255,.25);
    --state:#00ff9d;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:#000;
    color:#e9fbff;
    font-family:Arial,Helvetica,sans-serif;
}

button,input{font:inherit}

.app{
    width:100%;
    height:100vh;
    position:relative;
    overflow:hidden;
    background:#000;
}

/* TOP BAR */
.topbar-voice{
    margin-left:18px;
    margin-right:auto;
    height:34px;
    min-width:92px;
    padding:0 12px;
    border:1px solid rgba(0,217,255,.45);
    background:rgba(0,30,43,.72);
    color:#9feeff;
    cursor:pointer;
    font-size:10px;
    letter-spacing:1px;
    transition:.2s;
}
.topbar-voice:hover{
    border-color:var(--cyan);
    box-shadow:0 0 16px rgba(0,217,255,.22);
}
.topbar-voice.listening{
    color:#fff;
    border-color:var(--green);
    box-shadow:0 0 18px rgba(0,255,157,.28);
    animation:voicePulse 1s infinite;
}
.topbar-voice.stop-mode{
    border-color:var(--green);
}
@media (max-width:500px){
    .topbar-voice{
        min-width:72px;
        height:30px;
        margin-left:10px;
        padding:0 8px;
        font-size:8px;
    }
}
.topbar{
    position:absolute;
    top:0;
    left:0;
    right:0;
    height:70px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 25px;
    border-bottom:1px solid rgba(0,217,255,.16);
    background:rgba(0,5,10,.72);
    backdrop-filter:blur(12px);
    z-index:30;
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
}

.brand-mark{
    width:40px;
    height:40px;
    display:flex;
    align-items:center;
    justify-content:center;
    border:1px solid var(--cyan);
    color:#fff;
    font-weight:700;
    letter-spacing:2px;
    box-shadow:0 0 18px rgba(0,217,255,.3);
}

.brand-title{
    font-size:18px;
    letter-spacing:5px;
}

.brand-sub{
    margin-top:3px;
    color:#56899b;
    font-size:8px;
    letter-spacing:2px;
}

.system-status{
    display:flex;
    align-items:center;
    gap:8px;
    padding:8px 12px;
    border:1px solid var(--line);
    color:#bceeff;
    font-size:9px;
    letter-spacing:2px;
}

.status-dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:var(--state);
    box-shadow:0 0 12px var(--state);
}

/* MAIN HUD */
.hud{
    position:absolute;
    inset:70px 0 0 0;
}

/* CORE */
.core-system{
    position:absolute;
    left:38%;
    top:43%;
    transform:translate(-50%,-50%);
    width:min(410px,42vw);
    aspect-ratio:1;
    display:flex;
    align-items:center;
    justify-content:center;
}

.ring{
    position:absolute;
    border-radius:50%;
    border:1px solid var(--line);
}

.ring.one{
    inset:0;
    border-top-color:var(--state);
    border-bottom-color:rgba(0,217,255,.06);
    animation:spin 18s linear infinite;
}

.ring.two{
    inset:7%;
    border-left-color:var(--state);
    border-right-color:rgba(0,217,255,.05);
    animation:spinReverse 13s linear infinite;
}

.ring.three{
    inset:17%;
    border:2px solid transparent;
    border-top-color:var(--state);
    border-bottom-color:rgba(0,217,255,.06);
    animation:spin 9s linear infinite;
}

.ring.four{
    inset:27%;
    border:2px dashed rgba(0,217,255,.45);
    animation:spinReverse 7s linear infinite;
}

.marker-ring{
    position:absolute;
    inset:3%;
    border-radius:50%;
    animation:spin 25s linear infinite;
}

.marker-ring span{
    position:absolute;
    left:50%;
    top:-5px;
    width:2px;
    height:12px;
    background:var(--state);
    box-shadow:0 0 8px var(--state);
    transform-origin:0 calc((min(410px,42vw) * .47));
}

.marker-ring span:nth-child(2){transform:rotate(45deg)}
.marker-ring span:nth-child(3){transform:rotate(90deg)}
.marker-ring span:nth-child(4){transform:rotate(135deg)}
.marker-ring span:nth-child(5){transform:rotate(180deg)}
.marker-ring span:nth-child(6){transform:rotate(225deg)}
.marker-ring span:nth-child(7){transform:rotate(270deg)}
.marker-ring span:nth-child(8){transform:rotate(315deg)}

.ai-core{
    width:42%;
    aspect-ratio:1;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    background:radial-gradient(circle,#7bf2ff 0%,#00bde9 24%,#05638d 48%,#021a2c 72%,#000811 100%);
    border:2px solid rgba(190,250,255,.9);
    box-shadow:0 0 25px var(--state),0 0 70px rgba(0,150,255,.4),inset 0 0 35px rgba(255,255,255,.2);
    animation:corePulse 3s ease-in-out infinite;
}

.ai-core:before{
    content:"";
    position:absolute;
    inset:10%;
    border-radius:50%;
    border:1px solid rgba(255,255,255,.55);
    animation:innerPulse 2s ease-in-out infinite;
}

.ai-core:after{
    content:"";
    position:absolute;
    inset:22%;
    border-radius:50%;
    border:1px solid var(--state);
    box-shadow:0 0 12px var(--state);
}

.core-name{
    position:relative;
    z-index:3;
    color:#fff;
    font-size:clamp(26px,4vw,45px);
    font-weight:700;
    letter-spacing:8px;
    text-shadow:0 0 10px #fff,0 0 25px var(--state);
}

.core-state{
    position:absolute;
    bottom:27%;
    z-index:5;
    color:var(--state);
    font-size:8px;
    letter-spacing:3px;
    text-shadow:0 0 9px var(--state);
}

/* SIGNATURE */
.creator{
    position:absolute;
    left:38%;
    top:calc(43% + min(205px,21vw));
    transform:translateX(-50%);
    text-align:center;
    z-index:12;
}

.creator img{
    width:125px;
    max-width:18vw;
    display:block;
    margin:auto;
    filter:drop-shadow(0 0 8px rgba(0,217,255,.25));
}

.creator-label{
    margin-top:3px;
    color:#527887;
    font-size:7px;
    letter-spacing:2px;
}

/* RESPONSE AREA — RIGHT SIDE ONLY */
.response-panel{
    position:absolute;
    right:32px;
    top:18%;
    width:min(500px,43vw);
    height:57%;
    min-height:250px;
    display:flex;
    flex-direction:column;
    border:none;
    background:transparent;
    box-shadow:none;
    backdrop-filter:none;
    z-index:10;
}

.response-header{
    height:42px;
    flex:none;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 14px;
    border-bottom:none;
}

.response-title{
    color:var(--cyan);
    font-size:9px;
    letter-spacing:3px;
}

.response-state{
    color:var(--state);
    font-size:8px;
    letter-spacing:2px;
}

.response-content{
    flex:1;
    overflow-y:auto;
    padding:14px;
    scrollbar-width:thin;
}

.response-empty{
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#355866;
    text-align:center;
    font-size:10px;
    letter-spacing:2px;
}

.response-block{
    margin-bottom:14px;
}

.response-user{
    color:#6994a2;
    font-size:8px;
    letter-spacing:2px;
    margin-bottom:5px;
}

.response-user-text{
    color:#9eeeff;
    font-size:11px;
    line-height:1.5;
    margin-bottom:10px;
}

.response-aj{
    border-left:none;
    padding:10px 0;
    background:transparent;
    color:#effcff;
    font-size:12px;
    line-height:1.6;
    white-space:pre-wrap;
    overflow-wrap:anywhere;
    box-shadow:none;
    border-left:none;
    padding-left:0;
}

/* INPUT */
.selected-file-name{
    max-width:180px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    color:rgba(159,238,255,.75);
    font-size:9px;
    letter-spacing:.4px;
    margin-left:4px;
}
@media (max-width:500px){
    .selected-file-name{
        max-width:90px;
        font-size:8px;
    }
}
.command-bar{
    position:absolute;
    left:38%;
    bottom:22px;
    transform:translateX(-50%);
    width:min(560px,48vw);
    display:flex;
    gap:7px;
    z-index:25;
}

#messageInput{
    flex:1;
    min-width:0;
    height:44px;
    padding:0 13px;
    border:1px solid rgba(0,217,255,.35);
    outline:none;
    background:rgba(0,9,15,.95);
    color:#fff;
    font-size:12px;
}

#messageInput:focus{
    border-color:var(--cyan);
    box-shadow:0 0 16px rgba(0,217,255,.12);
}

.command-button{
    width:47px;
    height:44px;
    border:1px solid rgba(0,217,255,.3);
    background:rgba(0,30,43,.8);
    color:#9feeff;
    cursor:pointer;
    transition:.2s;
}

.command-button:hover{
    border-color:var(--cyan);
    box-shadow:0 0 14px rgba(0,217,255,.2);
}

.command-button.voice{
    width:75px;
}

.command-button.voice.listening{
    color:#fff;
    border-color:var(--green);
    box-shadow:0 0 18px rgba(0,255,157,.25);
    animation:voicePulse 1s infinite;
}

.command-button.stop{
    color:#ff7b91;
    border-color:rgba(255,23,68,.35);
}

.command-button.history{
    width:95px;
}

/* VOICE STATUS */
.voice-status{
    position:absolute;
    left:38%;
    top:9%;
    transform:translateX(-50%);
    color:#557d8b;
    font-size:8px;
    letter-spacing:3px;
    z-index:20;
}

.voice-status.listening{color:var(--green);text-shadow:0 0 10px var(--green)}
.voice-status.speaking{color:var(--cyan);text-shadow:0 0 10px var(--cyan)}
.voice-status.error{color:#ff6179}

/* HISTORY DRAWER */
.history-backdrop{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.48);
    opacity:0;
    pointer-events:none;
    transition:.25s;
    z-index:90;
}

.history-backdrop.open{
    opacity:1;
    pointer-events:auto;
}

.history-panel{
    position:fixed;
    top:0;
    right:0;
    width:min(390px,90vw);
    height:100vh;
    background:rgba(0,7,13,.98);
    border-left:1px solid rgba(0,217,255,.3);
    box-shadow:-20px 0 60px rgba(0,0,0,.6);
    transform:translateX(100%);
    transition:transform .28s ease;
    z-index:100;
    display:flex;
    flex-direction:column;
}

.history-panel.open{
    transform:translateX(0);
}

.history-head{
    height:65px;
    flex:none;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 16px;
    border-bottom:1px solid rgba(0,217,255,.2);
}

.history-title{
    color:var(--cyan);
    font-size:11px;
    letter-spacing:3px;
}

.history-close{
    width:34px;
    height:34px;
    border:1px solid rgba(255,23,68,.35);
    background:transparent;
    color:#ff7188;
    cursor:pointer;
}

.history-list{
    flex:1;
    overflow-y:auto;
    padding:14px;
}

.history-empty{
    color:#456875;
    font-size:10px;
    letter-spacing:1px;
    text-align:center;
    margin-top:40px;
}

.history-item{
    margin-bottom:13px;
    padding:10px;
    border:1px solid rgba(0,217,255,.12);
    background:rgba(0,20,30,.5);
}

.history-role{
    color:var(--cyan);
    font-size:8px;
    letter-spacing:2px;
    margin-bottom:5px;
}

.history-item.user .history-role{color:#7794a0}
.history-text{
    color:#dff9ff;
    font-size:11px;
    line-height:1.45;
    white-space:pre-wrap;
    overflow-wrap:anywhere;
}

.history-footer{
    padding:12px;
    border-top:1px solid rgba(0,217,255,.15);
}

.clear-history{
    width:100%;
    height:38px;
    border:1px solid rgba(255,23,68,.35);
    background:rgba(60,0,12,.25);
    color:#ff7188;
    cursor:pointer;
    font-size:9px;
    letter-spacing:2px;
}

/* ANIMATION */
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinReverse{to{transform:rotate(-360deg)}}
@keyframes corePulse{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
@keyframes innerPulse{0%,100%{opacity:.4;transform:scale(.96)}50%{opacity:1;transform:scale(1)}}
@keyframes voicePulse{50%{transform:scale(1.04)}}

/* MOBILE */
@media (max-width:800px){

    html,body{
        width:100%;
        height:100%;
        overflow:hidden;
    }

    .app{
        height:100dvh;
        min-height:0;
    }

    .topbar{
        height:58px;
        padding:0 12px;
    }

    .brand{
        gap:9px;
    }

    .brand-mark{
        width:34px;
        height:34px;
        font-size:15px;
    }

    .brand-title{
        font-size:13px;
        letter-spacing:3px;
    }

    .brand-sub{
        font-size:6px;
        letter-spacing:1.5px;
    }

    .system-status{
        font-size:7px;
        padding:6px 8px;
        gap:7px;
    }

    .hud{
        inset:58px 0 0 0;
        height:calc(100dvh - 58px);
    }

    /* VOICE MESSAGE */
    .voice-status{
        left:50%;
        top:5%;
        width:92%;
        text-align:center;
        font-size:7px;
        letter-spacing:2.5px;
        white-space:nowrap;
        overflow:hidden;
        text-overflow:ellipsis;
    }

    /* AJ CORE */
    .core-system{
        left:50%;
        top:24%;
        width:min(205px,54vw);
    }

    .core-name{
        font-size:30px;
        letter-spacing:7px;
    }

    .core-state{
        bottom:25%;
        font-size:7px;
        letter-spacing:2.5px;
    }

    .marker-ring span{
        transform-origin:0 calc((min(410px,42vw) * .47));
    }

    /* SIGNATURE */
    .creator{
        left:50%;
        top:calc(24% + min(112px,29vw));
        width:180px;
    }

    .creator img{
        width:78px;
        max-width:none;
    }

    .creator-label{
        margin-top:2px;
        font-size:6px;
        letter-spacing:1.6px;
        white-space:nowrap;
    }

    /* COMPACT RESPONSE CARD */
    .response-panel{
        left:12px;
        right:12px;
        top:53%;
        width:auto;
        height:27%;
        min-height:145px;
        max-height:220px;
        border:none;
        background:transparent;
        box-shadow:none;
    }

    .response-header{
        height:36px;
        padding:0 11px;
    }

    .response-title{
        font-size:8px;
        letter-spacing:2.5px;
    }

    .response-state{
        font-size:7px;
        letter-spacing:1.5px;
    }

    .response-content{
        padding:10px;
    }

    .response-empty{
        font-size:8px;
        letter-spacing:1.8px;
    }

    .response-user{
        font-size:7px;
    }

    .response-user-text{
        font-size:10px;
        line-height:1.4;
    }

    .response-aj{
        font-size:10px;
        line-height:1.45;
        padding:8px 9px;
    }

    /* COMMAND BAR — ALWAYS VISIBLE */
    .command-bar{
        position:absolute;
        left:10px;
        right:10px;
        bottom:max(8px, env(safe-area-inset-bottom));
        width:auto;
        transform:none;
        gap:5px;
        align-items:center;
    }

    #messageInput{
        height:42px;
        min-width:0;
        padding:0 10px;
        font-size:11px;
    }

    .command-button{
        height:42px;
        width:40px;
        min-width:40px;
        padding:0;
    }

    .command-button.voice{
        width:50px;
        min-width:50px;
        font-size:0;
    }

    .command-button.voice::after{
        content:"🎙";
        font-size:16px;
    }

    .command-button.stop{
        width:40px;
        min-width:40px;
        font-size:0;
    }

    .command-button.stop::after{
        content:"■";
        font-size:13px;
    }

    .command-button.history{
        width:48px;
        min-width:48px;
        font-size:0;
    }

    .command-button.history::after{
        content:"📜";
        font-size:15px;
    }

    .command-button.file{
        width:40px;
        min-width:40px;
        font-size:0;
    }

    .command-button.file::after{
        content:"📎";
        font-size:15px;
    }

    /* HISTORY */
    .history-panel{
        width:min(360px,92vw);
    }
}

@media (max-width:500px){

    .brand-sub{
        display:none;
    }

    .topbar{
        padding:0 10px;
    }

    .system-status{
        padding:5px 7px;
    }

    .system-status #topStatus{
        font-size:0;
    }

    .system-status #topStatus::after{
        content:"ON";
        font-size:7px;
    }

    .voice-status{
        top:4%;
        font-size:7px;
    }

    .core-system{
        top:22%;
        width:min(190px,52vw);
    }

    .core-name{
        font-size:27px;
    }

    .creator{
        top:calc(22% + min(105px,28vw));
    }

    .creator img{
        width:70px;
    }

    .creator-label{
        font-size:5.5px;
        letter-spacing:1.4px;
    }

    .response-panel{
        left:10px;
        right:10px;
        top:50%;
        height:28%;
        min-height:140px;
        max-height:205px;
    }

    .response-header{
        height:34px;
    }

    .response-content{
        padding:9px;
    }

    .command-bar{
        left:8px;
        right:8px;
        gap:4px;
    }

    #messageInput{
        height:40px;
        font-size:10.5px;
    }

    .command-button{
        height:40px;
        width:38px;
        min-width:38px;
    }

    .command-button.voice{
        width:46px;
        min-width:46px;
    }

    .command-button.history{
        width:44px;
        min-width:44px;
    }

    .command-button.file{
        width:40px;
        min-width:40px;
    }
}

@media (max-width:380px){

    .core-system{
        top:21%;
        width:175px;
    }

    .creator{
        top:calc(21% + 96px);
    }

    .creator img{
        width:64px;
    }

    .response-panel{
        top:49%;
        height:29%;
        min-height:135px;
    }

    .command-bar{
        left:6px;
        right:6px;
    }

    #messageInput{
        font-size:10px;
    }

    .command-button{
        width:35px;
        min-width:35px;
    }

    .command-button.voice{
        width:42px;
        min-width:42px;
    }

    .command-button.history{
        width:40px;
        min-width:40px;
    }

    .command-button.file{
        width:35px;
        min-width:35px;
    }
}


/* ============================================================
   AJ INTERFACE 2.0 — VISUAL POLISH
============================================================ */

:root{
    --glass:rgba(3,16,25,.72);
    --glow:rgba(0,217,255,.16);
}

.app::before{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;
    z-index:1;
    background:
        radial-gradient(circle at 38% 43%, rgba(0,217,255,.045), transparent 26%),
        radial-gradient(circle at 82% 35%, rgba(0,140,255,.035), transparent 30%);
}

.hud{
    isolation:isolate;
}

.topbar{
    box-shadow:0 1px 0 rgba(0,217,255,.05),0 10px 35px rgba(0,0,0,.25);
}

.brand-mark{
    border-radius:8px;
    background:linear-gradient(145deg,rgba(0,217,255,.12),rgba(0,0,0,.1));
}

.system-status{
    border-radius:999px;
    background:rgba(0,20,30,.45);
}

.ai-core{
    transition:box-shadow .3s ease,filter .3s ease;
}

.core-system:hover .ai-core{
    filter:brightness(1.08);
    box-shadow:
        0 0 32px var(--state),
        0 0 85px rgba(0,150,255,.45),
        inset 0 0 38px rgba(255,255,255,.22);
}

.response-content{
    mask-image:linear-gradient(to bottom,transparent 0,#000 10px,#000 calc(100% - 8px),transparent 100%);
}

.response-block{
    padding:11px 13px;
    border:1px solid rgba(0,217,255,.08);
    border-radius:10px;
    background:linear-gradient(135deg,rgba(0,20,30,.34),rgba(0,5,10,.12));
    box-shadow:inset 0 0 18px rgba(0,217,255,.018);
}

<script>
/* ============================================================
   ELEMENTS
============================================================ */

const input = document.getElementById("messageInput");
const sendButton = document.getElementById("sendButton");
const micButton = document.getElementById("micButton");
const voiceFloatButton = document.getElementById("voiceFloatButton");
const fileButton = document.getElementById("fileButton");
const fileInput = document.getElementById("fileInput");
const selectedFileName = document.getElementById("selectedFileName");
const stopVoiceButton = document.getElementById("stopVoiceButton");
const historyButton = document.getElementById("historyButton");

const voiceStatus = document.getElementById("voiceStatus");
const topStatus = document.getElementById("topStatus");
const statusDot = document.getElementById("statusDot");
const responseState = document.getElementById("responseState");
const responseContent = document.getElementById("responseContent");
const responseEmpty = document.getElementById("responseEmpty");

const historyPanel = document.getElementById("historyPanel");
const historyBackdrop = document.getElementById("historyBackdrop");
const historyClose = document.getElementById("historyClose");
const historyList = document.getElementById("historyList");
const clearHistoryButton = document.getElementById("clearHistory");

const taskButton = document.getElementById("taskButton");
const taskPanel = document.getElementById("taskPanel");
const taskBackdrop = document.getElementById("taskBackdrop");
const taskClose = document.getElementById("taskClose");
const taskContent = document.getElementById("taskContent");
const taskRefresh = document.getElementById("taskRefresh");


/* ============================================================
   STATE
============================================================ */

let recognition = null;
let listening = false;
let speaking = false;
let processing = false;
let shouldKeepListening = false;
let voiceActive = false;
let restartTimer = null;
let microphoneStream = null;

let history = [];
let taskList = [];



/* ============================================================
   AJ INTERFACE 2.0 — MODE HUD
============================================================ */

const modeCore = document.getElementById("modeCore");
const modeStudy = document.getElementById("modeStudy");
const modeCoding = document.getElementById("modeCoding");
const modeSearch = document.getElementById("modeSearch");
const modeFile = document.getElementById("modeFile");
const panelVoice = document.getElementById("panelVoice");

function resetModeHUD() {
    [modeCore, modeStudy, modeCoding, modeSearch, modeFile]
        .forEach(function(el) {
            if (el) el.classList.remove("active");
        });

    if (modeCore) modeCore.classList.add("active");
}

function setModeHUD(mode) {
    resetModeHUD();

    const value = String(mode || "").toLowerCase();

    if (value.includes("study") && modeStudy) {
        modeStudy.classList.add("active", "study");
    } else if (value.includes("coding") && modeCoding) {
        modeCoding.classList.add("active", "coding");
    } else if (value.includes("search") && modeSearch) {
        modeSearch.classList.add("active");
    } else if (value.includes("file") && modeFile) {
        modeFile.classList.add("active", "file");
    }
}

function detectInterfaceMode(message) {
    const text = String(message || "").toLowerCase();

    if (
        text.includes("study") ||
        text.startsWith("explain ") ||
        text.startsWith("teach me ") ||
        text.startsWith("quiz me") ||
        text.startsWith("summarize ") ||
        text.startsWith("summarise ") ||
        text.startsWith("revise ")
    ) {
        return "study";
    }

    if (
        text.includes("code") ||
        text.includes("coding") ||
        text.includes("debug") ||
        text.includes("program") ||
        text.includes("python") ||
        text.includes("java") ||
        text.includes("c++") ||
        text.includes("javascript") ||
        text.includes("sql")
    ) {
        return "coding";
    }

    if (
        text.startsWith("search") ||
        text.startsWith("google ") ||
        text.includes("latest news")
    ) {
        return "search";
    }

    return "core";
}

function setInterfaceActivity(message, state) {
    const mode = detectInterfaceMode(message);

    if (String(state || "").toUpperCase() === "SEARCHING") {
        setModeHUD("search");
    } else if (String(state || "").toUpperCase() === "EXECUTING") {
        setModeHUD("core");
    } else {
        setModeHUD(mode);
    }
}

function setVoicePanelState(value) {
    if (panelVoice) {
        panelVoice.textContent = String(value || "READY").toUpperCase();
    }
}


/* ============================================================
   STATUS
============================================================ */

function setStatus(state) {
    const value = String(state || "ONLINE").toUpperCase();

    topStatus.textContent = value;
    if (value === "ERROR") {
        statusDot.style.background = "#ff1744";
        statusDot.style.boxShadow = "0 0 12px #ff1744";
    } else if (value === "THINKING" || value === "SEARCHING" || value === "EXECUTING") {
        statusDot.style.background = "#00d9ff";
        statusDot.style.boxShadow = "0 0 12px #00d9ff";
    } else {
        statusDot.style.background = "var(--state)";
        statusDot.style.boxShadow = "0 0 12px var(--state)";
    }
}

function setVoiceStatus(text, type="") {
    voiceStatus.textContent = text;
    voiceStatus.className = "voice-status " + type;
}


/* ============================================================
   RESPONSE DISPLAY
   AJ ANSWERS ARE SHOWN ONLY IN THE RIGHT PANEL
============================================================ */

function escapeHTML(text) {
    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
}

function addResponse(userText, ajText) {

    responseEmpty?.remove();

    const block = document.createElement("div");
    block.className = "response-block";

    const userLabel = document.createElement("div");
    userLabel.className = "response-user";
    userLabel.textContent = "YOU";

    const userMessage = document.createElement("div");
    userMessage.className = "response-user-text";
    userMessage.textContent = userText;

    const ajMessage = document.createElement("div");
    ajMessage.className = "response-aj";
    ajMessage.textContent = ajText;

    block.appendChild(userLabel);
    block.appendChild(userMessage);
    block.appendChild(ajMessage);

    responseContent.appendChild(block);
    responseContent.scrollTop = responseContent.scrollHeight;
}

function showThinking() {
    responseState.textContent = "THINKING";
}

function showReady() {
    responseState.textContent = "READY";
}


/* ============================================================
   HISTORY
============================================================ */

function renderHistory() {

    historyList.innerHTML = "";

    if (!history.length) {
        const empty = document.createElement("div");
        empty.className = "history-empty";
        empty.textContent = "NO CONVERSATION HISTORY";
        historyList.appendChild(empty);
        return;
    }

    history.forEach(item => {

        const row = document.createElement("div");
        row.className =
            "history-item " +
            (item.role === "user" ? "user" : "assistant");

        const role = document.createElement("div");
        role.className = "history-role";
        role.textContent =
            item.role === "user" ? "YOU" : "AJ";

        const text = document.createElement("div");
        text.className = "history-text";
        text.textContent = item.content;

        row.appendChild(role);
        row.appendChild(text);
        historyList.appendChild(row);
    });
}

function openHistory() {
    renderHistory();
    historyPanel.classList.add("open");
    historyBackdrop.classList.add("open");
}

function closeHistory() {
    historyPanel.classList.remove("open");
    historyBackdrop.classList.remove("open");
}

historyButton.addEventListener("click", openHistory);
historyClose.addEventListener("click", closeHistory);
historyBackdrop.addEventListener("click", closeHistory);

clearHistoryButton.addEventListener("click", function() {
    history = [];
    renderHistory();
});


/* ============================================================
   TASK CENTER — STEP 14.8
============================================================ */

function taskStatusLabel(status) {
    return String(status || "UNKNOWN").replace(/_/g, " ").toUpperCase();
}

function taskStepClass(status) {
    return String(status || "").toLowerCase();
}

function renderTasks() {
    if (!taskContent) return;

    taskContent.innerHTML = "";

    if (!taskList.length) {
        const empty = document.createElement("div");
        empty.className = "task-empty";
        empty.textContent = "NO TASKS FOUND";
        taskContent.appendChild(empty);
        return;
    }

    taskList.slice().reverse().forEach(function(task) {
        const card = document.createElement("div");
        card.className = "task-card" +
            (String(task.status || "").toLowerCase() === "running" ? " current" : "");

        const goal = document.createElement("div");
        goal.className = "task-goal";
        goal.textContent = task.goal || "Untitled task";

        const meta = document.createElement("div");
        meta.className = "task-meta";
        meta.textContent = taskStatusLabel(task.status) +
            " • " + String(task.progress ?? 0) + "%";

        const progress = document.createElement("div");
        progress.className = "task-progress";
        const bar = document.createElement("div");
        bar.className = "task-progress-bar";
        bar.style.width = Math.max(0, Math.min(100, Number(task.progress || 0))) + "%";
        progress.appendChild(bar);

        card.appendChild(goal);
        card.appendChild(meta);
        card.appendChild(progress);

        (task.steps || []).forEach(function(step, index) {
            const stepEl = document.createElement("div");
            stepEl.className = "task-step " + taskStepClass(step.status);
            stepEl.textContent = (index + 1) + ". " +
                String(step.title || step.description || "Task step");
            card.appendChild(stepEl);
        });

        const actions = document.createElement("div");
        actions.className = "task-actions";

        if (["pending", "paused", "waiting_confirmation", "running"].includes(
            String(task.status || "").toLowerCase()
        )) {
            const continueButton = document.createElement("button");
            continueButton.className = "task-action";
            continueButton.textContent = "CONTINUE";
            continueButton.onclick = function() { continueTask(task.id); };
            actions.appendChild(continueButton);
        }

        if (!["completed", "cancelled", "failed"].includes(
            String(task.status || "").toLowerCase()
        )) {
            const runButton = document.createElement("button");
            runButton.className = "task-action run";
            runButton.textContent = "RUN SAFE";
            runButton.onclick = function() { runTask(task.id); };
            actions.appendChild(runButton);
        }

        const waiting = (task.steps || []).some(function(step) {
            return String(step.status || "").toLowerCase() === "waiting_confirmation";
        });

        if (waiting) {
            const confirmButton = document.createElement("button");
            confirmButton.className = "task-action";
            confirmButton.textContent = "CONFIRM STEP";
            confirmButton.onclick = function() { confirmTask(task.id); };
            actions.appendChild(confirmButton);
        }

        if (!["completed", "cancelled", "failed"].includes(
            String(task.status || "").toLowerCase()
        )) {
            const cancelButton = document.createElement("button");
            cancelButton.className = "task-action danger";
            cancelButton.textContent = "CANCEL";
            cancelButton.onclick = function() { cancelTask(task.id); };
            actions.appendChild(cancelButton);
        }

        if (actions.children.length) card.appendChild(actions);
        taskContent.appendChild(card);
    });
}

async function loadTasks() {
    try {
        const response = await fetch("/api/tasks", { cache: "no-store" });
        const data = await response.json();
        if (!response.ok) throw new Error(data.response || "Task API error");
        taskList = Array.isArray(data.tasks) ? data.tasks : [];
        renderTasks();
    } catch (error) {
        console.error("TASK LOAD ERROR:", error);
        if (taskContent) {
            taskContent.innerHTML = '<div class="task-empty">TASK SERVICE UNAVAILABLE</div>';
        }
    }
}

function handleTaskBrowserResult(value) {
    if (typeof value !== "string") return false;
    if (!value.startsWith("__AJ_OPEN_URL__")) return false;

    const url = value.replace("__AJ_OPEN_URL__", "").trim();

    if (!/^https?:\/\//i.test(url)) return false;

    setStatus("EXECUTING");
    setVoiceStatus("OPENING WEBSITE...");
    window.location.href = url;
    return true;
}

function showTaskExecutionResults(data) {
    const results = Array.isArray(data && data.results)
        ? data.results
        : [];

    let navigating = false;

    results.forEach(function(result) {
        if (!result) return;

        if (handleTaskBrowserResult(result.result)) {
            navigating = true;
            return;
        }

        if (result.message) {
            addResponse("TASK CENTER", result.message);
        } else if (result.result) {
            addResponse("TASK CENTER", String(result.result));
        }
    });

    if (data && data.execution) {
        const execution = data.execution;

        if (handleTaskBrowserResult(execution.result)) {
            navigating = true;
        } else if (execution.message) {
            addResponse("TASK CENTER", execution.message);
        } else if (execution.result) {
            addResponse("TASK CENTER", String(execution.result));
        }
    }

    return navigating;
}

async function taskAction(endpoint, taskId) {
    try {
        setStatus("EXECUTING");

        const response = await fetch(endpoint, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ task_id: taskId })
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.response || "Task action failed");
        }

        await loadTasks();

        const navigating = showTaskExecutionResults(data);

        if (!navigating && data.summary) {
            addResponse("TASK CENTER", data.summary);
        }

        if (!navigating) {
            setStatus("ONLINE");
            setVoiceStatus("TASK CENTER READY");
        }
    } catch (error) {
        console.error("TASK ACTION ERROR:", error);
        addResponse("TASK CENTER", error.message || "Task action failed.");
        setStatus("ERROR");
        setVoiceStatus("TASK ERROR", "error");

        setTimeout(function() {
            setStatus("ONLINE");
            setVoiceStatus("VOICE READY");
        }, 1200);
    }
}

function continueTask(taskId) {
    taskAction("/api/tasks/continue", taskId);
}

function runTask(taskId) {
    taskAction("/api/tasks/run", taskId);
}

function confirmTask(taskId) {
    taskAction("/api/tasks/confirm", taskId);
}

function cancelTask(taskId) {
    taskAction("/api/tasks/cancel", taskId);
}

function openTaskCenter() {
    taskPanel.classList.add("open");
    taskBackdrop.classList.add("open");
    loadTasks();
}

function closeTaskCenter() {
    taskPanel.classList.remove("open");
    taskBackdrop.classList.remove("open");
}

taskButton.addEventListener("click", openTaskCenter);
taskClose.addEventListener("click", closeTaskCenter);
taskBackdrop.addEventListener("click", closeTaskCenter);
taskRefresh.addEventListener("click", loadTasks);

/* ============================================================
   SPEECH OUTPUT
============================================================ */

function speak(text) {

    if (!("speechSynthesis" in window)) {
        setVoiceStatus("VOICE OUTPUT NOT SUPPORTED", "error");
        return;
    }

    const cleanText = String(text)
        .replace(/https?:\/\/\S+/g, "")
        .replace(/[*#_`]/g, "")
        .trim();

    if (!cleanText) {
        scheduleListening();
        return;
    }

    window.speechSynthesis.cancel();

    const utterance =
        new SpeechSynthesisUtterance(cleanText);

    utterance.lang = "en-IN";
    utterance.rate = 0.96;
    utterance.pitch = 0.95;
    utterance.volume = 1;

    utterance.onstart = function() {
        speaking = true;
        setVoiceStatus("AJ SPEAKING", "speaking");
        setVoicePanelState("SPEAKING");
        setStatus("SPEAKING");
    };

    utterance.onend = function() {
        speaking = false;

        if (shouldKeepListening && !processing) {
            setStatus("LISTENING");
            scheduleListening();
        } else {
            setStatus("ONLINE");
            setVoiceStatus("VOICE READY");
        }
    };

    utterance.onerror = function() {
        speaking = false;
        setStatus("ONLINE");
        setVoiceStatus("VOICE READY");
    };

    window.speechSynthesis.speak(utterance);
}

function stopSpeaking() {

    if ("speechSynthesis" in window) {
        window.speechSynthesis.cancel();
    }

    speaking = false;
    setStatus("ONLINE");
    setVoiceStatus("VOICE READY");
}


function syncVoiceButton() {

    if (!voiceFloatButton) {
        return;
    }

    if (listening || voiceActive) {
        voiceFloatButton.classList.add("listening");
        voiceFloatButton.classList.add("stop-mode");
        voiceFloatButton.textContent = "STOP";
    } else {
        voiceFloatButton.classList.remove("listening");
        voiceFloatButton.classList.remove("stop-mode");
        voiceFloatButton.textContent = "VOICE";
    }
}


/* ============================================================
   VOICE INPUT
============================================================ */

function setupRecognition() {

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
        recognition = null;
        setVoiceStatus("USE CHROME FOR VOICE", "error");
        return false;
    }

    recognition = new SpeechRecognition();

    recognition.lang = "en-IN";
    recognition.continuous = false;
    recognition.interimResults = true;
    recognition.maxAlternatives = 1;

    recognition.onstart = function() {
        listening = true;
        micButton.classList.add("listening");
        setVoiceStatus("LISTENING FOR AJ...", "listening");
        setVoicePanelState("LISTENING");
        setStatus("LISTENING");
    };

    recognition.onresult = function(event) {

        let transcript = "";

        for (let i = event.resultIndex; i < event.results.length; i++) {
            transcript += event.results[i][0].transcript;
        }

        transcript = transcript.trim();
        input.value = transcript;

        if (!event.results[event.results.length - 1].isFinal) {
            setVoiceStatus("HEARING: " + transcript, "listening");
            return;
        }

        if (!transcript) {
            return;
        }

        listening = false;

        try {
            recognition.stop();
        } catch (error) {}

        sendVoiceMessage(transcript);
    };

    recognition.onerror = function(event) {

        listening = false;
        micButton.classList.remove("listening");
        syncVoiceButton();

        if (event.error === "not-allowed" ||
            event.error === "service-not-allowed") {

            shouldKeepListening = false;
            setVoiceStatus(
                "MICROPHONE PERMISSION REQUIRED",
                "error"
            );
            setStatus("ONLINE");
            return;
        }

        if (event.error === "no-speech") {
            setVoiceStatus("NO SPEECH — LISTENING AGAIN");
        } else {
            setVoiceStatus("VOICE READY");
        }

        if (shouldKeepListening &&
            !processing &&
            !speaking) {

            scheduleListening();
        }
    };

    recognition.onend = function() {

        listening = false;
        micButton.classList.remove("listening");
        syncVoiceButton();

        if (shouldKeepListening &&
            !processing &&
            !speaking) {

            scheduleListening();
        }
    };

    return true;
}

async function requestMicrophonePermission() {

    if (!navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia) {

        setVoiceStatus("MICROPHONE API NOT AVAILABLE", "error");
        return false;
    }

    try {

        if (!microphoneStream) {

            microphoneStream =
                await navigator.mediaDevices.getUserMedia({
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true
                    }
                });
        }

        return true;

    } catch (error) {

        console.error("Microphone permission:", error);

        if (error.name === "NotAllowedError" ||
            error.name === "PermissionDeniedError") {

            setVoiceStatus(
                "ALLOW MICROPHONE IN CHROME",
                "error"
            );

        } else if (error.name === "NotFoundError") {

            setVoiceStatus(
                "NO MICROPHONE FOUND",
                "error"
            );

        } else {

            setVoiceStatus(
                "MICROPHONE ERROR",
                "error"
            );
        }

        setStatus("ONLINE");
        return false;
    }
}

async function startListening() {

    if (!recognition) {
        return;
    }

    if (listening || processing || speaking) {
        return;
    }

    const microphoneReady =
        await requestMicrophonePermission();

    if (!microphoneReady) {
        shouldKeepListening = false;
        voiceActive = false;
        return;
    }

    try {

        recognition.start();

    } catch (error) {

        console.log("Recognition start:", error);

        if (voiceActive &&
            shouldKeepListening &&
            !listening) {

            clearTimeout(restartTimer);

            restartTimer = setTimeout(
                function() {
                    startListening();
                },
                500
            );
        }
    }
}

function stopListening() {

    listening = false;
    clearTimeout(restartTimer);

    if (recognition) {
        try {
            recognition.abort();
        } catch (error) {}
    }

    if (microphoneStream) {

        microphoneStream
            .getTracks()
            .forEach(function(track) {
                track.stop();
            });

        microphoneStream = null;
    }

    micButton.classList.remove("listening");
    syncVoiceButton();
    setVoiceStatus("VOICE READY");
}

function scheduleListening() {

    clearTimeout(restartTimer);

    if (!voiceActive || !shouldKeepListening ||
        processing ||
        speaking ||
        listening) {

        return;
    }

    restartTimer = setTimeout(function() {
        startListening();
    }, 800);
}

if (voiceFloatButton) {
    voiceFloatButton.addEventListener("click", async function() {

        if (!recognition) {
            setVoiceStatus("USE CHROME FOR VOICE", "error");
            return;
        }

        if (listening || voiceActive) {

            shouldKeepListening = false;
            voiceActive = false;

            stopListening();
            stopSpeaking();

            setStatus("ONLINE");
            setVoiceStatus("VOICE STOPPED");

            syncVoiceButton();

            return;
        }

        shouldKeepListening = true;
        voiceActive = true;

        syncVoiceButton();

        setVoiceStatus("CHECKING MICROPHONE...");

        const microphoneReady =
            await requestMicrophonePermission();

        if (!microphoneReady) {

            shouldKeepListening = false;
            voiceActive = false;

            syncVoiceButton();

            return;
        }

        setVoiceStatus("STARTING VOICE...");

        startListening();
    });
}


micButton.addEventListener("click", async function() {

    if (!recognition) {
        setVoiceStatus("USE CHROME FOR VOICE", "error");
        return;
    }

    if (listening) {
        shouldKeepListening = false;
        voiceActive = false;
        stopListening();
        return;
    }

    shouldKeepListening = true;
    voiceActive = true;

    setVoiceStatus("CHECKING MICROPHONE...");

    const microphoneReady =
        await requestMicrophonePermission();

    if (!microphoneReady) {
        shouldKeepListening = false;
        voiceActive = false;
        return;
    }

    setVoiceStatus("STARTING VOICE...");

    startListening();
});

stopVoiceButton.addEventListener("click", function() {
    shouldKeepListening = false;
    voiceActive = false;
    stopListening();
    stopSpeaking();
    setStatus("ONLINE");
    setVoiceStatus("VOICE STOPPED");
});


/* ============================================================
   DIRECT WEBSITE OPENING
============================================================ */

function openWebsiteDirectly(message) {

    const text = String(message || "")
        .toLowerCase()
        .trim()
        .replace(/[.!?]+$/g, "");

    const sites = {
        "youtube": "https://www.youtube.com/",
        "google": "https://www.google.com/",
        "gmail": "https://mail.google.com/",
        "instagram": "https://www.instagram.com/",
        "facebook": "https://www.facebook.com/",
        "whatsapp": "https://web.whatsapp.com/",
        "github": "https://github.com/",
        "linkedin": "https://www.linkedin.com/",
        "twitter": "https://x.com/",
        "x": "https://x.com/",
        "spotify": "https://open.spotify.com/",
        "netflix": "https://www.netflix.com/",
        "amazon": "https://www.amazon.in/",
        "chatgpt": "https://chatgpt.com/",
        "gemini": "https://gemini.google.com/"
    };

    let siteName = null;

    const match = text.match(
        /^(?:open|launch|start|go to|take me to|visit)\s+(.+)$/
    );

    if (!match) {
        return false;
    }

    siteName = match[1]
        .trim()
        .replace(/\bwebsite\b/g, "")
        .trim();

    const url = sites[siteName];

    if (!url) {
        return false;
    }

    /*
       Use the same browser tab for a direct command.
       This avoids showing "Opening YouTube..." as an AJ answer.
    */
    window.location.href = url;

    return true;
}


/* ============================================================
   FILE INTELLIGENCE
============================================================ */

fileButton.addEventListener("click", function() {
    fileInput.click();
});

fileInput.addEventListener("change", async function() {

    const file = fileInput.files[0];

    if (!file || processing) {
        if (selectedFileName) selectedFileName.textContent = "";

        return;
    }

    if (selectedFileName) {
        selectedFileName.textContent = file.name;
        selectedFileName.title = file.name;
    }

    processing = true;
    setModeHUD("file");
    setVoicePanelState("READING");
    fileButton.classList.add("file-button-active");
    showThinking();
    responseState.textContent = "READING";
    setStatus("THINKING");
    setVoiceStatus("AJ READING FILE");

    try {

        const formData = new FormData();
        formData.append("file", file);

        const response = await fetch("/api/upload", {
            method: "POST",
            body: formData
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(
                data.response || "File upload failed."
            );
        }

        const answer = data.response ||
            "AJ processed the file.";

        history.push({
            role: "user",
            content: "Uploaded: " + file.name
        });

        history.push({
            role: "assistant",
            content: answer
        });

        addResponse(
            "Uploaded: " + file.name,
            answer
        );

        setStatus("ONLINE");
        processing = false;
        fileButton.classList.remove("file-button-active");
        fileInput.value = "";
        if (selectedFileName) selectedFileName.textContent = "";
        speak(answer);

    } catch (error) {

        console.error("AJ FILE:", error);

        const errorText =
            error.message ||
            "AJ could not process that file.";

        addResponse(
            "Uploaded: " + file.name,
            errorText
        );

        processing = false;
        fileButton.classList.remove("file-button-active");
        fileInput.value = "";
        if (selectedFileName) selectedFileName.textContent = "";
        setStatus("ERROR");
        setVoiceStatus("FILE ERROR", "error");

        setTimeout(function() {
            setStatus("ONLINE");
            if (shouldKeepListening) {
                scheduleListening();
            }
        }, 1200);
    }
});


/* ============================================================
   ADVANCED VOICE COMMAND
============================================================ */

async function sendVoiceMessage(message) {

    const spokenMessage = String(message || "").trim();

    if (!spokenMessage || processing) {
        return;
    }

    processing = true;
    setInterfaceActivity(spokenMessage, "THINKING");
    setVoicePanelState("THINKING");

    stopListening();
    showThinking();
    setStatus("THINKING");
    setVoiceStatus("AJ UNDERSTANDING");

    try {

        const response = await fetch("/api/voice", {
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                message:spokenMessage,
                history:history,
                client:"AJ 2.0"
            })
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(
                data.response || "AJ voice request failed."
            );
        }

        const command =
            data.command ||
            spokenMessage;

        const answer =
            data.response ||
            "I received your voice command.";

        // AJ backend can request a real browser navigation for voice commands.
        if (typeof answer === "string" &&
            answer.startsWith("__AJ_OPEN_URL__")) {

            const url = answer
                .replace("__AJ_OPEN_URL__", "")
                .trim();

            if (/^https?:\/\//i.test(url)) {
                processing = false;
                setStatus("ONLINE");
                setVoiceStatus("OPENING WEBSITE...");
                window.location.href = url;
                return;
            }
        }

        history.push({
            role:"user",
            content:spokenMessage
        });

        history.push({
            role:"assistant",
            content:answer
        });

        addResponse(
            spokenMessage,
            answer
        );

        processing = false;

        setStatus(data.state || "ONLINE");

        if (data.wake_word) {
            setVoiceStatus("AJ COMMAND RECEIVED");
        } else {
            setVoiceStatus("AJ VOICE READY");
        }

        /* AJ speaks every voice response. */
        speak(answer);

    } catch (error) {

        console.error("AJ VOICE:", error);

        const errorText =
            error.message ||
            "AJ could not process that voice command.";

        addResponse(
            spokenMessage,
            errorText
        );

        history.push({
            role:"user",
            content:spokenMessage
        });

        history.push({
            role:"assistant",
            content:errorText
        });

        processing = false;

        setStatus("ERROR");
        setVoiceStatus("AJ VOICE ERROR", "error");

        setTimeout(function() {

            setStatus("ONLINE");

            if (shouldKeepListening) {
                scheduleListening();
            }

        }, 1200);
    }
}


/* ============================================================
   SEND MESSAGE
============================================================ */

async function sendMessage() {

    const message = input.value.trim();

    if (!message || processing) {
        return;
    }

    /* Open supported websites directly instead of sending the
       command to AJ's AI backend. */
    if (openWebsiteDirectly(message)) {
        input.value = "";
        shouldKeepListening = false;
        voiceActive = false;
        stopListening();
        setStatus("ONLINE");
        setVoiceStatus("OPENING WEBSITE...");
        return;
    }

    processing = true;
    setInterfaceActivity(message, "THINKING");
    setVoicePanelState("THINKING");

    stopListening();
    showThinking();
    setStatus("THINKING");
    setVoiceStatus("AJ THINKING");

    input.value = "";

    try {

        const response = await fetch("/api/command", {
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                message:message,
                history:history,
                client:"AJ 2.0"
            })
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(
                data.response || "AJ request failed."
            );
        }

        const answer =
            data.response ||
            "I received your request.";

        // AJ backend can request a real browser navigation.
        if (typeof answer === "string" &&
            answer.startsWith("__AJ_OPEN_URL__")) {

            const url = answer
                .replace("__AJ_OPEN_URL__", "")
                .trim();

            if (/^https?:\/\//i.test(url)) {
                window.location.href = url;
                processing = false;
                setStatus("ONLINE");
                setVoiceStatus("OPENING WEBSITE...");
                return;
            }
        }

        history.push({
            role:"user",
            content:message
        });

        history.push({
            role:"assistant",
            content:answer
        });

        addResponse(message, answer);

        setStatus(data.state || "ONLINE");

        processing = false;

        /* AJ SPEAKS EVERY ANSWER */
        speak(answer);

    } catch (error) {

        console.error("AJ:", error);

        const errorText =
            "I encountered an error while processing that command.";

        addResponse(message, errorText);

        history.push({
            role:"user",
            content:message
        });

        history.push({
            role:"assistant",
            content:errorText
        });

        processing = false;

        setStatus("ERROR");
        setVoiceStatus("AJ ERROR", "error");

        setTimeout(function() {
            setStatus("ONLINE");

            if (shouldKeepListening) {
                scheduleListening();
            }
        }, 1200);
    }
}


/* ============================================================
   ENTER KEY
============================================================ */

input.addEventListener("keydown", function(event) {

    if (event.key === "Enter") {
        event.preventDefault();
        sendMessage();
    }
});

sendButton.addEventListener("click", sendMessage);


/* ============================================================
   STATUS FROM SERVER
============================================================ */

async function updateServerStatus() {

    try {

        const response =
            await fetch("/api/status");

        if (!response.ok) {
            return;
        }

        const data =
            await response.json();

        if (!listening &&
            !speaking &&
            !processing) {

            setStatus(data.state || "ONLINE");
        }

    } catch (error) {
        console.log("AJ status unavailable");
    }
}


/* ============================================================
   START AJ
============================================================ */

function initializeAJ() {

    setStatus("ONLINE");
    resetModeHUD();
    setVoicePanelState("READY");
    syncVoiceButton();
    setVoiceStatus("PRESS VOICE TO START • SAY HEY AJ", "");

    const supported =
        setupRecognition();

    if (!supported) {
        setStatus("ONLINE");
        return;
    }

    setVoiceStatus("VOICE READY");

    /* Microphone starts only after the user presses VOICE.
       This avoids Chrome blocking speech recognition before
       a user gesture/permission has been granted. */
    shouldKeepListening = false;
    voiceActive = false;
    setVoiceStatus("PRESS VOICE TO START • SAY HEY AJ");
}


/* ============================================================
   FIRST-INTERACTION FALLBACK
============================================================ */

document.addEventListener("click", function() {

    if (!recognition) {
        return;
    }

    /* Do not start the microphone from a generic page click.
       Speech recognition must be started by the VOICE button. */

}, {passive:true});


/* ============================================================
   PAGE LOAD
============================================================ */

window.addEventListener("load", function() {

    initializeAJ();

    updateServerStatus();

    setInterval(
        updateServerStatus,
        3000
    );
});
