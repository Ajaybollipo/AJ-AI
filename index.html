<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AJ — Personal AI Assistant</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            width: 100%;
            min-height: 100vh;
            overflow: hidden;
            background: #000;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
        }

        /* =====================================================
           MAIN HUD
        ===================================================== */

        .hud {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background:
                radial-gradient(
                    circle at center,
                    rgba(0, 220, 255, 0.08),
                    transparent 35%
                ),
                #000;
        }

        /* =====================================================
           TOP BAR
        ===================================================== */

        .top-bar {
            position: absolute;
            top: 20px;
            left: 25px;
            right: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 20;
        }

        .brand {
            color: #00eaff;
            font-size: 25px;
            font-weight: bold;
            letter-spacing: 6px;
            text-shadow: 0 0 15px #00eaff;
        }

        .online {
            color: #00ff88;
            font-size: 12px;
            letter-spacing: 2px;
        }

        .online::before {
            content: "";
            display: inline-block;
            width: 8px;
            height: 8px;
            margin-right: 8px;
            border-radius: 50%;
            background: #00ff88;
            box-shadow: 0 0 12px #00ff88;
        }

        /* =====================================================
           LEFT PANELS
        ===================================================== */

        .left-panels {
            position: absolute;
            top: 90px;
            left: 25px;
            width: 230px;
            z-index: 10;
        }

        .panel {
            border: none;
            background: transparent;
            box-shadow: none;
            padding: 15px 0;
            margin-bottom: 15px;
        }

        .panel-title {
            color: #00eaff;
            font-size: 11px;
            letter-spacing: 3px;
            margin-bottom: 12px;
        }

        .panel-line {
            display: flex;
            justify-content: space-between;
            margin: 7px 0;
            font-size: 11px;
            color: #aaa;
        }

        .panel-value {
            color: #fff;
        }

        .green {
            color: #00ff88;
        }

        .red {
            color: #ff3030;
        }

        .cyan {
            color: #00eaff;
        }

        /* =====================================================
           CORE
        ===================================================== */

        .core-area {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -52%);
            width: 500px;
            height: 500px;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 900px;
        }

        /* Outer energy halo */
        .core-ring {
            position: absolute;
            width: 390px;
            height: 390px;
            border: 1px solid rgba(0, 234, 255, 0.42);
            border-radius: 50%;
            box-shadow:
                0 0 35px rgba(0, 234, 255, 0.14),
                inset 0 0 35px rgba(0, 234, 255, 0.08);
            animation: coreRotate 18s linear infinite;
        }

        .core-ring::before {
            content: "";
            position: absolute;
            inset: 25px;
            border: 1px dashed rgba(0, 234, 255, 0.38);
            border-radius: 50%;
            animation: coreRotateReverse 11s linear infinite;
        }

        .core-ring::after {
            content: "";
            position: absolute;
            inset: 65px;
            border: 1px solid rgba(255, 48, 48, 0.55);
            border-left-color: transparent;
            border-right-color: transparent;
            border-radius: 50%;
            animation: coreRotate 7s linear infinite;
        }

        /* Additional technical rings */
        .core-ring-2,
        .core-ring-3 {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
        }

        .core-ring-2 {
            width: 300px;
            height: 300px;
            border: 2px solid transparent;
            border-top-color: #00eaff;
            border-bottom-color: rgba(0, 234, 255, 0.18);
            box-shadow: 0 0 20px rgba(0, 234, 255, 0.12);
            animation: coreRotateReverse 8s linear infinite;
        }

        .core-ring-3 {
            width: 240px;
            height: 240px;
            border: 1px dotted rgba(255, 48, 48, 0.5);
            box-shadow: inset 0 0 18px rgba(255, 48, 48, 0.08);
            animation: coreRotate 5s linear infinite;
        }

        /* Central AI energy field */
        .core {
            position: relative;
            width: 175px;
            height: 175px;
            border-radius: 50%;
            border: 2px solid #00eaff;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            font-size: 48px;
            font-weight: bold;
            letter-spacing: 6px;
            text-shadow:
                0 0 8px #ffffff,
                0 0 20px #00eaff,
                0 0 35px #00eaff;
            background:
                radial-gradient(
                    circle,
                    rgba(0, 234, 255, 0.16) 0%,
                    rgba(0, 234, 255, 0.06) 35%,
                    rgba(0, 0, 0, 0.96) 72%
                );
            box-shadow:
                0 0 25px rgba(0, 234, 255, 0.55),
                0 0 70px rgba(0, 234, 255, 0.22),
                inset 0 0 35px rgba(0, 234, 255, 0.18);
            animation: corePulse 2.4s ease-in-out infinite;
            z-index: 5;
        }

        .core::before {
            content: "";
            position: absolute;
            inset: 13px;
            border-radius: 50%;
            border: 1px solid rgba(0, 234, 255, 0.55);
            box-shadow:
                inset 0 0 18px rgba(0, 234, 255, 0.15);
            animation: innerSpin 4s linear infinite;
        }

        .core::after {
            content: "";
            position: absolute;
            width: 9px;
            height: 9px;
            right: 22px;
            top: 22px;
            background: #ff3030;
            border-radius: 50%;
            box-shadow:
                0 0 8px #ff3030,
                0 0 20px #ff3030;
            animation: warningPulse 1.2s ease-in-out infinite;
        }

        /* Orbiting energy points */
        .core-orbit {
            position: absolute;
            width: 430px;
            height: 430px;
            border-radius: 50%;
            animation: coreRotateReverse 12s linear infinite;
            pointer-events: none;
        }

        .core-orbit::before,
        .core-orbit::after {
            content: "";
            position: absolute;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #00eaff;
            box-shadow:
                0 0 8px #00eaff,
                0 0 18px #00eaff;
        }

        .core-orbit::before {
            left: 50%;
            top: -3px;
            transform: translateX(-50%);
        }

        .core-orbit::after {
            right: 18%;
            bottom: 7%;
            background: #ff3030;
            box-shadow:
                0 0 8px #ff3030,
                0 0 18px #ff3030;
        }

        .core-scan {
            position: absolute;
            width: 205px;
            height: 205px;
            border-radius: 50%;
            border: 1px solid transparent;
            border-top-color: rgba(0, 234, 255, 0.75);
            border-bottom-color: rgba(0, 234, 255, 0.15);
            animation: scanSpin 3s linear infinite;
            pointer-events: none;
            z-index: 6;
        }

        .core-status {
            position: absolute;
            bottom: 22px;
            color: #00eaff;
            font-size: 11px;
            letter-spacing: 4px;
            text-shadow: 0 0 10px rgba(0, 234, 255, 0.6);
        }

        /* =====================================================
           CHAT
        ===================================================== */

        .chat-area {
            position: absolute;
            left: 50%;
            bottom: 25px;
            transform: translateX(-50%);
            width: min(700px, calc(100% - 40px));
            z-index: 30;
        }

        .messages {
            max-height: 150px;
            overflow-y: auto;
            margin-bottom: 10px;
            padding: 5px;
        }

        .message {
            margin: 6px 0;
            padding: 8px 12px;
            border-left: 2px solid #00eaff;
            background: rgba(0, 234, 255, 0.04);
            font-size: 13px;
            line-height: 1.5;
        }

        .message.user {
            border-left-color: #ff3030;
            color: #fff;
        }

        .message.ai {
            color: #00eaff;
        }

        .input-row {
            display: flex;
            gap: 8px;
        }

        #commandInput {
            flex: 1;
            height: 45px;
            padding: 0 15px;
            outline: none;
            border: 1px solid rgba(0, 234, 255, 0.55);
            background: rgba(0, 10, 15, 0.9);
            color: white;
            font-size: 14px;
        }

        #commandInput:focus {
            border-color: #00eaff;
            box-shadow: 0 0 12px rgba(0, 234, 255, 0.2);
        }

        button {
            height: 45px;
            padding: 0 15px;
            border: 1px solid #00eaff;
            background: rgba(0, 234, 255, 0.08);
            color: #00eaff;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: rgba(0, 234, 255, 0.2);
            box-shadow: 0 0 12px rgba(0, 234, 255, 0.25);
        }

        #stopVoice {
            border-color: #ff3030;
            color: #ff3030;
        }

        #stopVoice:hover {
            background: rgba(255, 48, 48, 0.12);
        }

        /* =====================================================
           VOICE INDICATOR
        ===================================================== */

        .voice-status {
            position: absolute;
            top: 65px;
            left: 50%;
            transform: translateX(-50%);
            color: #777;
            font-size: 10px;
            letter-spacing: 3px;
            z-index: 20;
            text-align: center;
        }

        .voice-status.listening {
            color: #00ff88;
            text-shadow: 0 0 12px #00ff88;
        }

        .voice-status.speaking {
            color: #00eaff;
            text-shadow: 0 0 12px #00eaff;
        }

        .voice-status.error {
            color: #ff3030;
        }

        /* =====================================================
           SIGNATURE
        ===================================================== */

        .creator-signature {
            position: absolute;
            left: 50%;
            top: calc(50% + 170px);
            transform: translateX(-50%);
            width: 150px;
            max-width: 25vw;
            height: auto;
            opacity: 0.8;
            z-index: 50;
            pointer-events: none;
            filter:
                drop-shadow(0 0 5px rgba(0, 234, 255, 0.5))
                drop-shadow(0 0 3px rgba(255, 40, 40, 0.25));
        }

        .creator-signature-label {
            position: absolute;
            left: 50%;
            top: calc(50% + 245px);
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.45);
            font-size: 7px;
            letter-spacing: 2px;
            z-index: 51;
            pointer-events: none;
        }

        /* =====================================================
           ANIMATIONS
        ===================================================== */

        @keyframes coreRotate {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        @keyframes coreRotateReverse {
            from {
                transform: rotate(360deg);
            }

            to {
                transform: rotate(0deg);
            }
        }

        @keyframes corePulse {
            0%,
            100% {
                transform: scale(1);
                box-shadow:
                    0 0 25px rgba(0, 234, 255, 0.55),
                    0 0 70px rgba(0, 234, 255, 0.22),
                    inset 0 0 35px rgba(0, 234, 255, 0.18);
            }

            50% {
                transform: scale(1.045);
                box-shadow:
                    0 0 40px rgba(0, 234, 255, 0.75),
                    0 0 95px rgba(0, 234, 255, 0.3),
                    inset 0 0 45px rgba(0, 234, 255, 0.26);
            }
        }

        @keyframes innerSpin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(-360deg);
            }
        }

        @keyframes scanSpin {
            from {
                transform: rotate(0deg) scale(1);
            }

            50% {
                transform: rotate(180deg) scale(1.04);
            }

            to {
                transform: rotate(360deg) scale(1);
            }
        }

        @keyframes warningPulse {
            0%,
            100% {
                opacity: 0.55;
                transform: scale(0.85);
            }

            50% {
                opacity: 1;
                transform: scale(1.25);
            }
        }

        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 700px) {

            .top-bar {
                top: 15px;
                left: 15px;
                right: 15px;
            }

            .brand {
                font-size: 20px;
            }

            .left-panels {
                top: 65px;
                left: 12px;
                width: 145px;
            }

            .panel {
                padding: 9px 0;
                margin-bottom: 8px;
            }

            .panel-title {
                font-size: 8px;
                margin-bottom: 7px;
            }

            .panel-line {
                font-size: 8px;
                margin: 4px 0;
            }

            .core-area {
                width: 340px;
                height: 340px;
                top: 42%;
            }

            .core-ring {
                width: 275px;
                height: 275px;
            }

            .core-ring-2 {
                width: 220px;
                height: 220px;
            }

            .core-ring-3 {
                width: 175px;
                height: 175px;
            }

            .core-orbit {
                width: 300px;
                height: 300px;
            }

            .core-scan {
                width: 145px;
                height: 145px;
            }

            .core {
                width: 120px;
                height: 120px;
                font-size: 32px;
            }

            .core-status {
                bottom: 5px;
                font-size: 8px;
            }

            .chat-area {
                width: calc(100% - 20px);
                bottom: 10px;
            }

            .messages {
                max-height: 110px;
            }

            .input-row {
                flex-wrap: wrap;
            }

            #commandInput {
                width: 100%;
                flex-basis: 100%;
            }

            button {
                flex: 1;
                padding: 0 8px;
            }

            .creator-signature {
                left: 50%;
                right: auto;
                top: calc(42% + 120px);
                transform: translateX(-50%);
                width: 105px;
            }

            .creator-signature-label {
                left: 50%;
                right: auto;
                top: calc(42% + 175px);
                transform: translateX(-50%);
                font-size: 5px;
            }
        }
    </style>
</head>

<body>

<div class="hud">

    <!-- =====================================================
         TOP
    ====================================================== -->

    <div class="top-bar">

        <div class="brand">
            AJ
        </div>

        <div class="online">
            ONLINE
        </div>

    </div>


    <!-- =====================================================
         VOICE STATUS
    ====================================================== -->

    <div
        id="voiceStatus"
        class="voice-status"
    >
        INITIALIZING VOICE...
    </div>


    <!-- =====================================================
         CORE
    ====================================================== -->

    <div class="core-area">

        <div class="core-ring"></div>

        <div class="core-ring-2"></div>

        <div class="core-ring-3"></div>

        <div class="core-orbit"></div>

        <div class="core-scan"></div>

        <div class="core">
            AJ
        </div>

        <div
            id="coreStatus"
            class="core-status"
        >
            STANDBY
        </div>

    </div>


    <!-- =====================================================
         CHAT
    ====================================================== -->

    <div class="chat-area">

        <div
            id="messages"
            class="messages"
        ></div>

        <div class="input-row">

            <input
                id="commandInput"
                type="text"
                placeholder="Talk to AJ..."
                autocomplete="off"
            >

            <button
                id="sendButton"
                type="button"
            >
                ▶ SEND
            </button>

            <button
                id="stopVoice"
                type="button"
            >
                ■ STOP
            </button>

        </div>

    </div>


    <!-- =====================================================
         CREATOR SIGNATURE
    ====================================================== -->

    <img
        class="creator-signature"
        src="/static/images/ajay_signature_transparent.png?v=2"
        alt="Ajay Bollipo signature"
    >

    <div class="creator-signature-label">
        CREATED BY AJAY BOLLIPO
    </div>

</div>


<script>

    /* ========================================================
       ELEMENTS
    ======================================================== */

    const commandInput =
        document.getElementById("commandInput");

    const sendButton =
        document.getElementById("sendButton");

    const stopVoiceButton =
        document.getElementById("stopVoice");

    const messages =
        document.getElementById("messages");

    const voiceStatus =
        document.getElementById("voiceStatus");

    const coreStatus =
        document.getElementById("coreStatus");


    /* ========================================================
       STATE
    ======================================================== */

    let recognition = null;

    let listening = false;

    let speaking = false;

    let processing = false;

    let shouldKeepListening = true;

    let history = [];

    let restartTimer = null;


    /* ========================================================
       UI HELPERS
    ======================================================== */

    function setVoiceStatus(
        text,
        type = ""
    ) {

        voiceStatus.textContent = text;

        voiceStatus.className =
            "voice-status " + type;

    }


    function setCoreStatus(text) {

        coreStatus.textContent = text;

    }


    function addMessage(
        text,
        type
    ) {

        const message =
            document.createElement("div");

        message.className =
            "message " + type;

        message.textContent =
            text;

        messages.appendChild(message);

        messages.scrollTop =
            messages.scrollHeight;

    }


    /* ========================================================
       TEXT TO SPEECH
    ======================================================== */

    function speak(text) {

        if (
            !("speechSynthesis" in window)
        ) {

            setVoiceStatus(
                "VOICE NOT SUPPORTED",
                "error"
            );

            return;

        }


        window.speechSynthesis.cancel();


        const cleanText =
            String(text)
                .replace(/[*#_`]/g, "")
                .trim();


        if (!cleanText) {

            startListening();

            return;

        }


        const utterance =
            new SpeechSynthesisUtterance(
                cleanText
            );


        utterance.lang =
            "en-IN";

        utterance.rate =
            1.0;

        utterance.pitch =
            1.0;

        utterance.volume =
            1.0;


        utterance.onstart =
            function () {

                speaking = true;

                setVoiceStatus(
                    "AJ SPEAKING",
                    "speaking"
                );

                setCoreStatus(
                    "SPEAKING"
                );

            };


        utterance.onend =
            function () {

                speaking = false;

                setCoreStatus(
                    "LISTENING"
                );

                setVoiceStatus(
                    "LISTENING",
                    "listening"
                );

                if (
                    shouldKeepListening
                ) {

                    startListening();

                }

            };


        utterance.onerror =
            function () {

                speaking = false;

                if (
                    shouldKeepListening
                ) {

                    startListening();

                }

            };


        window.speechSynthesis.speak(
            utterance
        );

    }


    /* ========================================================
       SEND COMMAND TO AJ
    ======================================================== */

    async function sendMessage(
        message
    ) {

        if (
            processing ||
            !message.trim()
        ) {

            return;

        }


        processing = true;


        if (recognition) {

            try {

                recognition.stop();

            } catch (error) {}

        }


        listening = false;


        addMessage(
            message,
            "user"
        );


        setCoreStatus(
            "THINKING"
        );

        setVoiceStatus(
            "THINKING..."
        );


        try {

            const response =
                await fetch(
                    "/api/command",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({

                            message:
                                message,

                            history:
                                history

                        })

                    }
                );


            const data =
                await response.json();


            if (
                !response.ok
            ) {

                throw new Error(
                    data.response ||
                    "AJ request failed."
                );

            }


            const reply =
                data.response ||
                "I don't have a response right now.";


            history.push({

                role: "user",

                content:
                    message

            });


            history.push({

                role: "assistant",

                content:
                    reply

            });


            /*
             * Keep history from becoming too large.
             */

            if (
                history.length > 20
            ) {

                history =
                    history.slice(-20);

            }


            addMessage(
                reply,
                "ai"
            );


            processing = false;


            speak(reply);


        } catch (error) {

            console.error(
                "AJ ERROR:",
                error
            );


            const errorMessage =
                "I'm having trouble processing that right now.";


            addMessage(
                errorMessage,
                "ai"
            );


            processing = false;

            setCoreStatus(
                "ERROR"
            );


            speak(errorMessage);

        }

    }


    /* ========================================================
       SEND BUTTON
    ======================================================== */

    sendButton.addEventListener(
        "click",
        function () {

            const text =
                commandInput.value.trim();


            if (!text) {

                return;

            }


            commandInput.value =
                "";


            sendMessage(text);

        }
    );


    /* ========================================================
       ENTER KEY
    ======================================================== */

    commandInput.addEventListener(
        "keydown",
        function (event) {

            if (
                event.key === "Enter"
            ) {

                event.preventDefault();

                sendButton.click();

            }

        }
    );


    /* ========================================================
       STOP VOICE
    ======================================================== */

    stopVoiceButton.addEventListener(
        "click",
        function () {

            shouldKeepListening =
                false;


            if (recognition) {

                try {

                    recognition.stop();

                } catch (error) {}

            }


            window.speechSynthesis.cancel();


            listening = false;

            speaking = false;


            setVoiceStatus(
                "VOICE STOPPED"
            );

            setCoreStatus(
                "STANDBY"
            );

        }
    );


    /* ========================================================
       SPEECH RECOGNITION
    ======================================================== */

    async function unlockMicrophone() {

        if (!navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia) {

            return true;

        }

        try {

            const stream =
                await navigator.mediaDevices.getUserMedia({
                    audio: true
                });

            stream.getTracks().forEach(
                function (track) {
                    track.stop();
                }
            );

            return true;

        } catch (error) {

            console.error(
                "Microphone permission:",
                error
            );

            setVoiceStatus(
                "ALLOW MICROPHONE",
                "error"
            );

            setCoreStatus(
                "MIC PERMISSION"
            );

            return false;

        }

    }


    function setupRecognition() {

        const SpeechRecognition =
            window.SpeechRecognition ||
            window.webkitSpeechRecognition;


        if (!SpeechRecognition) {

            setVoiceStatus(
                "VOICE INPUT NOT SUPPORTED",
                "error"
            );

            setCoreStatus(
                "VOICE UNAVAILABLE"
            );

            return false;

        }


        recognition =
            new SpeechRecognition();


        recognition.continuous =
            false;

        recognition.interimResults =
            true;

        recognition.maxAlternatives =
            1;

        recognition.lang =
            "en-IN";


        recognition.onstart =
            function () {

                listening = true;

                setVoiceStatus(
                    "LISTENING",
                    "listening"
                );

                setCoreStatus(
                    "LISTENING"
                );

            };


        recognition.onresult =
            function (event) {

                let transcript = "";

                for (
                    let i = event.resultIndex;
                    i < event.results.length;
                    i++
                ) {

                    transcript +=
                        event.results[i][0].transcript;

                }


                transcript =
                    transcript.trim();


                if (!transcript) {
                    return;
                }


                commandInput.value =
                    transcript;


                /*
                 * Only send once the browser has finished
                 * recognizing the sentence.
                 */

                const lastResult =
                    event.results[
                        event.results.length - 1
                    ];

                if (
                    lastResult &&
                    lastResult.isFinal
                ) {

                    sendMessage(
                        transcript
                    );

                }

            };


        recognition.onnomatch =
            function () {

                listening = false;

                setVoiceStatus(
                    "DIDN'T CATCH THAT"
                );

                setCoreStatus(
                    "LISTENING"
                );

                if (
                    shouldKeepListening &&
                    !processing &&
                    !speaking
                ) {

                    scheduleListening();

                }

            };


        recognition.onspeechend =
            function () {

                /*
                 * End the current recognition session
                 * cleanly after the user stops speaking.
                 */

                try {

                    recognition.stop();

                } catch (error) {}

            };


        recognition.onerror =
            function (event) {

                console.error(
                    "Speech recognition error:",
                    event.error
                );


                listening = false;


                if (
                    event.error === "not-allowed" ||
                    event.error === "service-not-allowed"
                ) {

                    setVoiceStatus(
                        "ALLOW MICROPHONE",
                        "error"
                    );

                    setCoreStatus(
                        "MIC PERMISSION"
                    );

                    return;

                }


                if (
                    event.error === "audio-capture"
                ) {

                    setVoiceStatus(
                        "MIC NOT FOUND",
                        "error"
                    );

                    setCoreStatus(
                        "CHECK MIC"
                    );

                    return;

                }


                if (
                    event.error === "no-speech"
                ) {

                    setVoiceStatus(
                        "LISTENING",
                        "listening"
                    );

                }


                if (
                    shouldKeepListening &&
                    !processing &&
                    !speaking
                ) {

                    scheduleListening();

                }

            };


        recognition.onend =
            function () {

                listening = false;


                if (
                    shouldKeepListening &&
                    !processing &&
                    !speaking
                ) {

                    scheduleListening();

                }

            };


        return true;

    }


    async function startListening() {

        if (
            !recognition ||
            listening ||
            processing ||
            speaking ||
            !shouldKeepListening
        ) {

            return;

        }


        const micReady =
            await unlockMicrophone();


        if (!micReady) {

            return;

        }


        try {

            recognition.start();

        } catch (error) {

            console.log(
                "Recognition start:",
                error
            );


            /*
             * If Chrome says recognition is already
             * active, wait and let onend restart it.
             */

            if (
                error.name !== "InvalidStateError"
            ) {

                scheduleListening();

            }

        }

    }


    function scheduleListening() {

        clearTimeout(
            restartTimer
        );


        restartTimer =
            setTimeout(
                function () {

                    startListening();

                },
                800
            );

    }


    async function initializeAJ() {

        setCoreStatus(
            "INITIALIZING"
        );


        const supported =
            setupRecognition();


        if (!supported) {

            setCoreStatus(
                "VOICE UNAVAILABLE"
            );

            return;

        }


        shouldKeepListening =
            true;


        setCoreStatus(
            "READY"
        );

        setVoiceStatus(
            "VOICE READY"
        );


        /*
         * Try automatic microphone activation.
         * Browsers may still require the first user
         * interaction before speech recognition starts.
         */

        setTimeout(
            function () {

                startListening();

            },
            500
        );

    }


    /* ========================================================
       FIRST USER INTERACTION FALLBACK
    ======================================================== */

    [
        "click",
        "touchstart",
        "pointerdown",
        "keydown"
    ].forEach(
        function (eventName) {

            document.addEventListener(
                eventName,
                function () {

                    if (
                        !listening &&
                        !processing &&
                        !speaking &&
                        shouldKeepListening
                    ) {

                        startListening();

                    }

                },
                {
                    passive: true
                }
            );

        }
    );


    /* ========================================================
       PAGE LOAD
    ======================================================== */

    window.addEventListener(
        "load",
        function () {

            initializeAJ();

        }
    );

</script>

</body>
</html>
