<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AJ — Personal Intelligence System</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --cyan: #00d9ff;
    --blue: #168cff;
    --green: #00ff9d;
    --dark: #01050a;
    --panel: rgba(3, 18, 30, 0.76);
    --line: rgba(0, 217, 255, 0.25);
    --glow: rgba(0, 217, 255, 0.5);
    --state: #00ff9d;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {
    overflow: hidden;
    background: #000000;
    color: #e9fbff;
    font-family: Arial, Helvetica, sans-serif;
}


/* ============================================================
   BACKGROUND
============================================================ */

.grid {
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0;

    background-image:
        linear-gradient(
            rgba(0,217,255,.08) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(0,217,255,.08) 1px,
            transparent 1px
        );

    background-size: 55px 55px;

    mask-image:
        radial-gradient(
            circle,
            black 15%,
            transparent 78%
        );
}

.scanlines {
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0;

    background:
        repeating-linear-gradient(
            0deg,
            transparent,
            transparent 3px,
            rgba(255,255,255,.08) 4px
        );

    z-index: 100;
}


/* ============================================================
   APP
============================================================ */

.app {
    position: relative;
    width: 100%;
    height: 100vh;

    display: flex;
    flex-direction: column;
}


/* ============================================================
   TOP BAR
============================================================ */

.topbar {
    height: 72px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 25px;

    border-bottom:
        1px solid rgba(0,217,255,.16);

    background:
        rgba(0,5,10,.58);

    backdrop-filter: blur(14px);

    z-index: 20;
}

.brand {
    display: flex;
    align-items: center;
    gap: 13px;
}

.brand-mark {
    width: 42px;
    height: 42px;

    display: flex;
    align-items: center;
    justify-content: center;

    border:
        1px solid var(--cyan);

    color: white;

    font-size: 16px;
    font-weight: bold;
    letter-spacing: 1px;

    box-shadow:
        0 0 15px rgba(0,217,255,.35),
        inset 0 0 12px rgba(0,217,255,.12);
}

.brand-title {
    font-size: 18px;
    letter-spacing: 5px;
    font-weight: 600;
}

.brand-sub {
    margin-top: 3px;

    color: #57899b;

    font-size: 8px;
    letter-spacing: 2px;
}

.system-status {
    display: flex;
    align-items: center;
    gap: 9px;

    padding: 8px 13px;

    border:
        1px solid var(--line);

    background:
        rgba(0,20,32,.55);

    font-size: 9px;
    letter-spacing: 1.5px;
}

.status-dot {
    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: var(--state);

    box-shadow:
        0 0 12px var(--state);

    transition:
        background .25s,
        box-shadow .25s;
}


/* ============================================================
   HUD
============================================================ */

.hud-area {
    position: relative;

    flex: 1;
    min-height: 0;

    display: flex;
    align-items: center;
    justify-content: center;
}


/* ============================================================
   CORE SYSTEM
============================================================ */

.core-system {
    width: min(440px, 65vw);
    height: min(440px, 65vw);

    position: relative;

    display: flex;
    align-items: center;
    justify-content: center;

    transition:
        filter .3s;
}


/* ============================================================
   RINGS
============================================================ */

.ring {
    position: absolute;

    border-radius: 50%;

    border:
        1px solid var(--line);

    transition:
        border-color .3s,
        animation-duration .4s;
}

.ring.one {
    width: 100%;
    height: 100%;

    border-top-color:
        var(--state);

    border-bottom-color:
        rgba(0,217,255,.07);

    animation:
        spin 18s linear infinite;
}

.ring.two {
    width: 87%;
    height: 87%;

    border-left-color:
        var(--state);

    border-right-color:
        rgba(0,217,255,.05);

    animation:
        spinReverse 14s linear infinite;
}

.ring.three {
    width: 72%;
    height: 72%;

    border-top:
        2px solid var(--state);

    border-bottom:
        2px solid rgba(0,217,255,.07);

    animation:
        spin 10s linear infinite;
}

.ring.four {
    width: 59%;
    height: 59%;

    border:
        2px dashed var(--state);

    animation:
        spinReverse 8s linear infinite;
}

@keyframes spin {

    to {
        transform: rotate(360deg);
    }
}

@keyframes spinReverse {

    to {
        transform: rotate(-360deg);
    }
}


/* ============================================================
   MARKERS
============================================================ */

.marker-ring {
    position: absolute;

    width: 94%;
    height: 94%;

    border-radius: 50%;

    animation:
        spin 25s linear infinite;
}

.marker-ring span {
    position: absolute;

    width: 2px;
    height: 13px;

    left: 50%;
    top: -6px;

    background:
        var(--state);

    box-shadow:
        0 0 8px var(--state);
}

.marker-ring span:nth-child(2) {
    transform:
        rotate(45deg);

    transform-origin:
        0 226px;
}

.marker-ring span:nth-child(3) {
    transform:
        rotate(90deg);

    transform-origin:
        0 226px;
}

.marker-ring span:nth-child(4) {
    transform:
        rotate(135deg);

    transform-origin:
        0 226px;
}

.marker-ring span:nth-child(5) {
    transform:
        rotate(180deg);

    transform-origin:
        0 226px;
}

.marker-ring span:nth-child(6) {
    transform:
        rotate(225deg);

    transform-origin:
        0 226px;
}

.marker-ring span:nth-child(7) {
    transform:
        rotate(270deg);

    transform-origin:
        0 226px;
}

.marker-ring span:nth-child(8) {
    transform:
        rotate(315deg);

    transform-origin:
        0 226px;
}


/* ============================================================
   SCANNER
============================================================ */

.scanner {
    position: absolute;

    width: 100%;
    height: 2px;

    background:
        linear-gradient(
            90deg,
            transparent,
            var(--state),
            transparent
        );

    filter:
        drop-shadow(
            0 0 8px var(--state)
        );

    animation:
        scan 5s linear infinite;

    transition:
        animation-duration .4s;
}

@keyframes scan {

    from {
        transform:
            rotate(0deg);
    }

    to {
        transform:
            rotate(360deg);
    }
}


/* ============================================================
   AI CORE
============================================================ */

.ai-core {
    width: 42%;
    height: 42%;

    position: relative;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            #70efff 0%,
            #00bde9 22%,
            #05638d 48%,
            #021a2c 72%,
            #000811 100%
        );

    border:
        2px solid rgba(180,250,255,.9);

    box-shadow:
        0 0 25px var(--state),
        0 0 70px rgba(0,150,255,.45),
        inset 0 0 35px rgba(255,255,255,.20);

    animation:
        corePulse 3s ease-in-out infinite;

    transition:
        box-shadow .3s,
        animation-duration .4s;
}

.ai-core::before {
    content: "";

    position: absolute;

    inset: 10%;

    border-radius: 50%;

    border:
        1px solid rgba(255,255,255,.5);

    animation:
        innerPulse 2s ease-in-out infinite;
}

.ai-core::after {
    content: "";

    position: absolute;

    inset: 22%;

    border-radius: 50%;

    border:
        1px solid var(--state);

    box-shadow:
        0 0 12px var(--state);
}

@keyframes corePulse {

    0%,
    100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.045);
    }
}

@keyframes innerPulse {

    0%,
    100% {
        opacity: .4;
        transform: scale(.96);
    }

    50% {
        opacity: 1;
        transform: scale(1);
    }
}

.core-name {
    position: relative;

    z-index: 5;

    color: white;

    font-size:
        clamp(25px, 5vw, 44px);

    font-weight: 700;

    letter-spacing: 8px;

    text-shadow:
        0 0 10px white,
        0 0 25px var(--state);
}

.core-state {
    position: absolute;

    bottom: 27%;

    z-index: 6;

    color: var(--state);

    font-size: 9px;

    letter-spacing: 3px;

    text-shadow:
        0 0 9px var(--state);

    transition:
        color .25s;
}


/* ============================================================
   AUDIO WAVE
============================================================ */

.wave {
    position: absolute;

    width: 48%;
    height: 48%;

    border-radius: 50%;

    pointer-events: none;

    opacity: .0;

    transition:
        opacity .3s;
}

.wave span {
    position: absolute;

    left: 50%;
    top: 50%;

    width: 2px;
    height: 24px;

    background: var(--state);

    transform-origin:
        0 70px;

    box-shadow:
        0 0 7px var(--state);

    animation:
        wavePulse .8s ease-in-out infinite;
}

.wave span:nth-child(2) {
    transform:
        rotate(30deg);
    animation-delay: .08s;
}

.wave span:nth-child(3) {
    transform:
        rotate(60deg);
    animation-delay: .16s;
}

.wave span:nth-child(4) {
    transform:
        rotate(90deg);
    animation-delay: .24s;
}

.wave span:nth-child(5) {
    transform:
        rotate(120deg);
    animation-delay: .32s;
}

.wave span:nth-child(6) {
    transform:
        rotate(150deg);
    animation-delay: .40s;
}

.wave span:nth-child(7) {
    transform:
        rotate(180deg);
    animation-delay: .48s;
}

.wave span:nth-child(8) {
    transform:
        rotate(210deg);
    animation-delay: .56s;
}

.wave span:nth-child(9) {
    transform:
        rotate(240deg);
    animation-delay: .64s;
}

.wave span:nth-child(10) {
    transform:
        rotate(270deg);
    animation-delay: .72s;
}

.wave span:nth-child(11) {
    transform:
        rotate(300deg);
    animation-delay: .80s;
}

.wave span:nth-child(12) {
    transform:
        rotate(330deg);
    animation-delay: .88s;
}

@keyframes wavePulse {

    0%,
    100% {
        height: 13px;
    }

    50% {
        height: 35px;
    }
}


/* ============================================================
   CHAT HISTORY DRAWER
============================================================ */

.topbar-actions {
    display: flex;
    align-items: center;
    gap: 10px;
}

.history-button {
    height: 38px;

    padding: 0 13px;

    border:
        1px solid rgba(0,217,255,.30);

    background:
        rgba(0,20,32,.60);

    color: #8beeff;

    font-size: 9px;
    letter-spacing: 1.5px;

    cursor: pointer;

    transition:
        .2s;

    box-shadow:
        0 0 12px rgba(0,217,255,.08);
}

.history-button:hover,
.history-button.active {
    border-color:
        var(--cyan);

    color: white;

    background:
        rgba(0,80,110,.42);

    box-shadow:
        0 0 18px rgba(0,217,255,.22);
}

.chat {
    position: fixed;

    top: 72px;
    right: 0;
    bottom: 0;

    width: min(390px, 88vw);

    padding: 20px 16px 95px;

    overflow-y: auto;

    z-index: 60;

    scrollbar-width: thin;

    background:
        linear-gradient(
            180deg,
            rgba(1,10,17,.97),
            rgba(0,0,0,.98)
        );

    border-left:
        1px solid rgba(0,217,255,.28);

    box-shadow:
        -12px 0 35px rgba(0,0,0,.55),
        inset 1px 0 0 rgba(255,23,68,.16);

    backdrop-filter:
        blur(18px);

    transform:
        translateX(105%);

    opacity: 0;

    visibility: hidden;

    pointer-events: none;

    transition:
        transform .28s ease,
        opacity .22s ease,
        visibility .28s;
}

.chat::before {
    content: "CHAT HISTORY";

    position: sticky;

    top: 0;

    display: block;

    margin-bottom: 15px;

    padding-bottom: 10px;

    color: var(--cyan);

    border-bottom:
        1px solid rgba(0,217,255,.14);

    font-size: 10px;

    letter-spacing: 3px;

    text-shadow:
        0 0 10px rgba(0,217,255,.35);
}

.chat.history-open {
    transform:
        translateX(0);

    opacity: 1;

    visibility: visible;

    pointer-events: auto;
}

.message {
    display: flex;

    margin: 6px 0;
}

.message.user {
    justify-content: flex-end;
}

.bubble {
    max-width: 85%;

    padding: 9px 13px;

    border:
        1px solid rgba(0,217,255,.2);

    background:
        rgba(1,12,20,.84);

    backdrop-filter:
        blur(10px);

    font-size: 12px;

    line-height: 1.45;
}

.message.user .bubble {
    border-color:
        rgba(0,217,255,.4);

    background:
        rgba(0,80,110,.45);
}

a {
    color: #65e7ff;
}


/* ============================================================
   ACTION BUTTON
============================================================ */

.action-button {
    display: block;

    margin-top: 7px;

    padding: 7px 11px;

    border:
        1px solid var(--state);

    background:
        rgba(0,80,110,.4);

    color: #8beeff;

    cursor: pointer;

    font-size: 10px;

    transition:
        .2s;
}

.action-button:hover {
    background:
        rgba(0,150,200,.35);

    box-shadow:
        0 0 12px rgba(0,217,255,.25);
}


/* ============================================================
   COMMAND BAR
============================================================ */

.command-bar {
    position: absolute;

    bottom: 20px;

    left: 50%;

    transform:
        translateX(-50%);

    width:
        min(650px, 92%);

    display: flex;

    gap: 8px;

    z-index: 20;
}

input {
    flex: 1;

    height: 46px;

    border:
        1px solid rgba(0,217,255,.35);

    outline: none;

    background:
        rgba(0,10,18,.92);

    color: white;

    padding:
        0 15px;

    font-size: 13px;

    backdrop-filter:
        blur(10px);
}

input:focus {
    border-color:
        var(--state);

    box-shadow:
        0 0 18px rgba(0,217,255,.15);
}

.command-button {
    width: 48px;

    border:
        1px solid rgba(0,217,255,.45);

    background:
        rgba(0,50,70,.75);

    color: white;

    font-size: 18px;

    cursor: pointer;

    transition:
        .2s;
}

.command-button:hover {
    background:
        rgba(0,120,160,.65);

    box-shadow:
        0 0 15px rgba(0,217,255,.25);
}

.mic.listening {
    background:
        rgba(190,20,60,.75);

    border-color:
        #ff1744;

    box-shadow:
        0 0 20px rgba(255,23,68,.45);
}

/* ============================================================
   RED ACCENT
============================================================ */

.red-accent {
    color: #ff1744;
    border-color: #ff1744;
    text-shadow: 0 0 10px rgba(255,23,68,.7);
}

.stop-voice {
    color: #ff4268;
    border-color: rgba(255,66,104,.55);
}

.stop-voice:hover {
    background: rgba(190,20,60,.55);
    border-color: #ff4268;
    box-shadow: 0 0 15px rgba(255,66,104,.30);
}


/* ============================================================
   MOBILE
============================================================ */

@media (max-width: 700px) {

    .topbar {
        height: 62px;
        padding: 0 12px;
    }

    .brand-title {
        font-size: 15px;
        letter-spacing: 3px;
    }

    .brand-sub {
        font-size: 7px;
    }

    .system-status {
        font-size: 8px;
    }

    .side-panel {
        display: none;
    }

    .core-system {
        width: 88vw;
        height: 88vw;

        max-width: 380px;
        max-height: 380px;
    }

    .chat {
        bottom: 82px;
        max-height: 135px;
    }

    .command-bar {
        bottom: 10px;
    }

    .wave span {
        transform-origin:
            0 58px;
    }
}


/* ============================================================
   CHAT HISTORY MOBILE
============================================================ */

@media (max-width: 700px) {

    .topbar {
        padding: 0 12px;
    }

    .brand-sub {
        display: none;
    }

    .history-button {
        padding: 0 9px;
        font-size: 8px;
    }

    .chat {
        top: 62px;
        width: min(360px, 92vw);
        padding-bottom: 100px;
    }

}


/* FUTURISTIC CREATOR SIGNATURE */
.creator-signature-wrap {
    position: absolute;
    left: 50%;
    top: calc(50% + 245px);
    transform: translateX(-50%);
    width: 210px;
    height: 82px;
    z-index: 55;
    pointer-events: none;
    display: flex;
    align-items: center;
    justify-content: center;
}

.creator-signature-wrap::before {
    content: "";
    position: absolute;
    width: 170px;
    height: 42px;
    border-radius: 50%;
    border: 1px solid rgba(0,217,255,.32);
    box-shadow: 0 0 14px rgba(0,217,255,.18),
                inset 0 0 14px rgba(0,217,255,.08);
    transform: perspective(120px) rotateX(58deg);
    animation: signaturePulse 2.4s ease-in-out infinite;
}

.creator-signature-wrap::after {
    content: "";
    position: absolute;
    width: 125px;
    height: 1px;
    bottom: 7px;
    background: linear-gradient(90deg, transparent, rgba(0,217,255,.9), rgba(255,23,68,.75), transparent);
    box-shadow: 0 0 9px rgba(0,217,255,.6);
    animation: signatureScan 2.8s linear infinite;
}

.creator-signature {
    position: relative;
    width: 165px;
    height: auto;
    opacity: .92;
    z-index: 3;
    filter: brightness(1.35) contrast(1.15)
            drop-shadow(0 0 3px rgba(255,255,255,.75))
            drop-shadow(0 0 8px rgba(0,217,255,.8))
            drop-shadow(0 0 15px rgba(0,217,255,.35));
    animation: signatureGlow 2.2s ease-in-out infinite;
}

.signature-label {
    position: absolute;
    left: 50%;
    bottom: -9px;
    transform: translateX(-50%);
    color: rgba(150,235,255,.62);
    font-size: 6px;
    letter-spacing: 3px;
    white-space: nowrap;
    text-shadow: 0 0 8px rgba(0,217,255,.45);
}

@keyframes signatureGlow {
    0%,100% {
        opacity: .72;
        transform: scale(.98);
    }
    50% {
        opacity: 1;
        transform: scale(1.035);
    }
}

@keyframes signaturePulse {
    0%,100% {
        opacity: .25;
        transform: perspective(120px) rotateX(58deg) scale(.92);
    }
    50% {
        opacity: .65;
        transform: perspective(120px) rotateX(58deg) scale(1.08);
    }
}

@keyframes signatureScan {
    0% {
        opacity: .15;
        transform: translateX(-38px);
    }
    50% { opacity: 1; }
    100% {
        opacity: .15;
        transform: translateX(38px);
    }
}

@media (max-width: 700px) {
    .creator-signature-wrap {
        top: calc(50% + 175px);
        width: 150px;
        height: 62px;
    }
    .creator-signature {
        width: 112px;
    }
    .creator-signature-wrap::before {
        width: 125px;
        height: 32px;
    }
    .creator-signature-wrap::after {
        width: 95px;
    }
    .signature-label {
        font-size: 4px;
        letter-spacing: 2px;
    }
}

</style>
</head>

    <!-- =====================================================

    ====================================================== -->

    <div class="command-bar">

        <input
            id="messageInput"
            type="text"
            placeholder="Speak or enter a command..."
            autocomplete="off"
        >

        <button
            class="command-button mic"
            id="micButton"
            title="Voice input">

            🎤

        </button>

        <button
            class="command-button stop-voice"
            id="stopVoiceButton"
            title="Stop voice">

            ■

        </button>

        <button
            class="command-button"
            id="sendButton"
            title="Send">

            ➤

        </button>

    </div>

</div>


<script>

/* ============================================================
   ELEMENTS
============================================================ */

const input =
    document.getElementById(
        "messageInput"
    );

const sendButton =
    document.getElementById(
        "sendButton"
    );

const micButton =
    document.getElementById(
        "micButton"
    );

const stopVoiceButton =
    document.getElementById(
        "stopVoiceButton"
    );

const chat =
    document.getElementById(
        "chat"
    );

const historyButton =
    document.getElementById(
        "historyButton"
    );

const statusText =
    document.getElementById(
        "statusText"
    );

const statusDot =
    document.getElementById(
        "statusDot"
    );

const coreState =
    document.getElementById(
        "coreState"
    );

const aiCore =
    document.getElementById(
        "aiCore"
    );

const scanner =
    document.getElementById(
        "scanner"
    );

const wave =
    document.getElementById(
        "wave"
    );

const coreSystem =
    document.getElementById(
        "coreSystem"
    );

const rings =
    document.querySelectorAll(
        ".ring"
    );


let history = [];

let recognition = null;

let listening = false;


/* ============================================================
   CHAT HISTORY TOGGLE
============================================================ */

function toggleHistory() {

    if (!chat || !historyButton) {
        return;
    }

    const isOpen =
        chat.classList.toggle(
            "history-open"
        );

    historyButton.classList.toggle(
        "active",
        isOpen
    );

    historyButton.textContent =
        isOpen
            ? "✕ CLOSE"
            : "☰ HISTORY";
}

if (historyButton) {

    historyButton.addEventListener(
        "click",
        function(event) {

            event.stopPropagation();

            toggleHistory();

        }
    );
}


/* ============================================================
   STATE COLORS
============================================================ */

const stateColors = {

    ONLINE:
        "#00ff9d",

    LISTENING:
        "#00d9ff",

    THINKING:
        "#ffd166",

    SEARCHING:
        "#a978ff",

    EXECUTING:
        "#ff9f43",

    SPEAKING:
        "#00e5ff",

    ERROR:
        "#ff1744",

    RED:
        "#ff1744"

};


/* ============================================================
   SET AJ STATE
============================================================ */

function setStatus(state) {

    const color =
        stateColors[state]
        || stateColors.ONLINE;


    statusText.textContent =
        state;

    coreState.textContent =
        state;


    document.documentElement
        .style
        .setProperty(
            "--state",
            color
        );


    statusDot.style.background =
        color;

    statusDot.style.boxShadow =
        `0 0 14px ${color}`;


    coreState.style.color =
        color;


    /* ========================================
       DEFAULT
    ======================================== */

    aiCore.style.animationDuration =
        "3s";

    scanner.style.animationDuration =
        "5s";

    wave.style.opacity =
        "0";


    rings.forEach(
        ring => {

            ring.style.animationDuration =
                "";

        }
    );


    /* ========================================
       LISTENING
    ======================================== */

    if (state === "LISTENING") {

        aiCore.style.animationDuration =
            "0.65s";

        scanner.style.animationDuration =
            "1.3s";

        wave.style.opacity =
            "1";

        rings.forEach(
            ring => {

                ring.style.animationDuration =
                    "3s";

            }
        );
    }


    /* ========================================
       THINKING
    ======================================== */

    else if (state === "THINKING") {

        aiCore.style.animationDuration =
            "1.1s";

        scanner.style.animationDuration =
            "2.3s";

        rings.forEach(
            ring => {

                ring.style.animationDuration =
                    "4s";

            }
        );
    }


    /* ========================================
       SEARCHING
    ======================================== */

    else if (state === "SEARCHING") {

        aiCore.style.animationDuration =
            "0.85s";

        scanner.style.animationDuration =
            "0.75s";

        rings.forEach(
            ring => {

                ring.style.animationDuration =
                    "2.3s";

            }
        );
    }


    /* ========================================
       EXECUTING
    ======================================== */

    else if (state === "EXECUTING") {

        aiCore.style.animationDuration =
            "0.55s";

        scanner.style.animationDuration =
            "0.45s";

        rings.forEach(
            ring => {

                ring.style.animationDuration =
                    "1.6s";

            }
        );
    }


    /* ========================================
       SPEAKING
    ======================================== */

    else if (state === "SPEAKING") {

        aiCore.style.animationDuration =
            "0.5s";

        scanner.style.animationDuration =
            "1s";

        wave.style.opacity =
            "1";

        rings.forEach(
            ring => {

                ring.style.animationDuration =
                    "2.8s";

            }
        );
    }


    /* ========================================
       ERROR
    ======================================== */

    else if (state === "ERROR") {

        aiCore.style.animationDuration =
            "0.25s";

        scanner.style.animationDuration =
            "0.3s";

        rings.forEach(
            ring => {

                ring.style.animationDuration =
                    "0.6s";

            }
        );
    }

}


/* ============================================================
   ADD MESSAGE
============================================================ */

function addMessage(
    sender,
    text,
    url = null
) {

    const message =
        document.createElement(
            "div"
        );

    message.className =
        "message " + sender;


    const bubble =
        document.createElement(
            "div"
        );

    bubble.className =
        "bubble";


    bubble.innerHTML =
        formatText(text);


    if (url) {

        // Open website directly instead of showing an "OPEN WEBSITE" button.
        // This works reliably on mobile browsers after AJ confirms the URL.
        setTimeout(function() {
            window.location.href = url;
        }, 100);
    }


    message.appendChild(
        bubble
    );

    chat.appendChild(
        message
    );


    chat.scrollTop =
        chat.scrollHeight;
}


/* ============================================================
   FORMAT RESPONSE
============================================================ */

function formatText(text) {

    let safe =
        String(text)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        );


    safe =
        safe.replace(
            /(https?:\/\/[^\s]+)/g,
            '<a href="$1" target="_blank">$1</a>'
        );


    return safe;
}


/* ============================================================
   SEND MESSAGE
============================================================ */

async function sendMessage() {

    const message =
        input.value.trim();


    if (!message) {
        return;
    }


    addMessage(
        "user",
        message
    );


    input.value =
        "";


    setStatus(
        "THINKING"
    );


    try {

        const response =
            await fetch(
                "/api/command",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        message:
                            message,

                        history:
                            history

                    })
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.response
                || "AJ request failed."
            );
        }


        /* ====================================
           HISTORY
        ==================================== */

        history.push({

            role:
                "user",

            content:
                message

        });


        history.push({

            role:
                "assistant",

            content:
                data.response

        });


        /* ====================================
           SERVER STATE
        ==================================== */

        setStatus(
            data.state
            || "ONLINE"
        );


        /* ====================================
           URL
        ==================================== */

        let url =
            null;


        const urlMatch =
            data.response &&
            data.response.match(
                /https?:\/\/[^\s]+/
            );


        if (urlMatch) {

            url =
                urlMatch[0]
                .replace(
                    /[.,)]$/,
                    ""
                );

        }


        /* ====================================
           AJ RESPONSE
        ==================================== */

        addMessage(
            "aj",
            data.response,
            url
        );


        /* ====================================
           SPEAK
        ==================================== */

        speak(
            data.response
            .replace(
                /https?:\/\/[^\s]+/g,
                ""
            )
        );


    }

    catch (error) {

        console.error(
            error
        );


        setStatus(
            "ERROR"
        );


        addMessage(
            "aj",
            "I encountered an error while processing that command."
        );


        setTimeout(
            function() {

                setStatus(
                    "ONLINE"
                );

            },
            1500
        );

    }

}


/* ============================================================
   ENTER KEY
============================================================ */

input.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key ===
            "Enter"
        ) {

            sendMessage();

        }

    }
);


/* ============================================================
   SEND BUTTON
============================================================ */

sendButton.onclick =
    sendMessage;



document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Escape" &&
            chat.classList.contains("history-open")
        ) {

            toggleHistory();

        }

    }
);

/* ============================================================
   ROBUST VOICE INPUT
============================================================ */

let recognition = null;
let listening = false;
let processing = false;
let speaking = false;
let shouldKeepListening = true;
let restartTimer = null;
let voiceReady = false;

function setVoiceListening() {
    if (typeof setStatus === "function") {
        setStatus("LISTENING");
    }
}

function startListening() {

    if (
        !recognition ||
        listening ||
        processing ||
        speaking ||
        !shouldKeepListening
    ) {
        return;
    }

    try {
        recognition.start();
    } catch (error) {
        console.log("Recognition start:", error);
    }
}

function scheduleListening(delay = 900) {

    clearTimeout(restartTimer);

    if (!shouldKeepListening) {
        return;
    }

    restartTimer = setTimeout(
        function () {
            startListening();
        },
        delay
    );
}

function setupRecognition() {

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if (!SpeechRecognition) {

        if (typeof setStatus === "function") {
            setStatus("VOICE UNAVAILABLE");
        }

        return false;
    }

    recognition = new SpeechRecognition();

    recognition.lang = "en-IN";
    recognition.continuous = false;
    recognition.interimResults = true;
    recognition.maxAlternatives = 1;

    recognition.onstart = function () {

        listening = true;
        voiceReady = true;

        setVoiceListening();
    };

    recognition.onresult = function (event) {

        let transcript = "";

        for (
            let i = event.resultIndex;
            i < event.results.length;
            i++
        ) {
            transcript +=
                event.results[i][0].transcript;
        }

        transcript = transcript.trim();

        if (!transcript) {
            return;
        }

        commandInput.value = transcript;

        /* Send only the final recognized sentence. */
        const lastResult =
            event.results[event.results.length - 1];

        if (
            lastResult &&
            lastResult.isFinal &&
            !processing
        ) {

            listening = false;

            try {
                recognition.stop();
            } catch (error) {}

            sendVoiceMessage(transcript);
        }
    };

    recognition.onerror = function (event) {

        console.log(
            "AJ voice error:",
            event.error
        );

        listening = false;

        if (
            event.error === "not-allowed" ||
            event.error === "service-not-allowed"
        ) {

            shouldKeepListening = false;

            if (typeof setStatus === "function") {
                setStatus("ALLOW MICROPHONE");
            }

            return;
        }

        if (
            event.error === "audio-capture" ||
            event.error === "network"
        ) {
            scheduleListening(1500);
            return;
        }

        if (
            shouldKeepListening &&
            !processing &&
            !speaking
        ) {
            scheduleListening();
        }
    };

    recognition.onend = function () {

        listening = false;

        if (
            shouldKeepListening &&
            !processing &&
            !speaking
        ) {
            scheduleListening();
        }
    };

    return true;
}

async function sendVoiceMessage(message) {

    if (
        processing ||
        !message ||
        !message.trim()
    ) {
        return;
    }

    processing = true;

    clearTimeout(restartTimer);

    try {

        const response =
            await fetch(
                "/api/command",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        message:
                            message.trim(),

                        history:
                            history
                    })
                }
            );

        const data =
            await response.json();

        if (!response.ok) {
            throw new Error(
                data.response ||
                "AJ request failed."
            );
        }

        history.push({
            role: "user",
            content: message.trim()
        });

        history.push({
            role: "assistant",
            content:
                data.response || ""
        });

        if (history.length > 20) {
            history =
                history.slice(-20);
        }

        addMessage(
            "user",
            message.trim()
        );

        addMessage(
            "aj",
            data.response ||
                "I don't have a response right now."
        );

        processing = false;

        speak(
            String(
                data.response || ""
            )
            .replace(
                /https?:\/\/[^\s]+/g,
                ""
            )
        );

    } catch (error) {

        console.error(
            "AJ voice command error:",
            error
        );

        processing = false;

        addMessage(
            "aj",
            "I couldn't process that voice command."
        );

        if (typeof setStatus === "function") {
            setStatus("ERROR");
        }

        scheduleListening(1500);
    }
}

/* ============================================================
   STOP VOICE
============================================================ */

function stopVoice() {

    shouldKeepListening = false;

    clearTimeout(restartTimer);

    if (recognition) {

        try {
            recognition.abort();
        } catch (error) {}
    }

    if (
        "speechSynthesis" in window
    ) {
        speechSynthesis.cancel();
    }

    listening = false;
    speaking = false;

    if (typeof setStatus === "function") {
        setStatus("ONLINE");
    }
}

if (typeof stopVoiceButton !== "undefined") {

    stopVoiceButton.addEventListener(
        "click",
        stopVoice
    );
}

/* ============================================================
   SPEECH OUTPUT
============================================================ */

function speak(text) {

    if (
        !text ||
        !("speechSynthesis" in window)
    ) {
        if (shouldKeepListening) {
            scheduleListening();
        }
        return;
    }

    speechSynthesis.cancel();

    const utterance =
        new SpeechSynthesisUtterance(
            String(text)
        );

    utterance.lang = "en-IN";
    utterance.rate = 0.94;
    utterance.pitch = 0.88;
    utterance.volume = 1;

    utterance.onstart = function () {
        speaking = true;

        if (typeof setStatus === "function") {
            setStatus("SPEAKING");
        }
    };

    utterance.onend = function () {

        speaking = false;

        if (typeof setStatus === "function") {
            setStatus("ONLINE");
        }

        if (shouldKeepListening) {
            scheduleListening(600);
        }
    };

    utterance.onerror = function () {

        speaking = false;

        if (shouldKeepListening) {
            scheduleListening(600);
        }
    };

    speechSynthesis.speak(
        utterance
    );
}

/* ============================================================
   INITIALIZE VOICE
============================================================ */

function initializeAJVoice() {

    shouldKeepListening = true;

    const supported =
        setupRecognition();

    if (!supported) {
        return;
    }

    /*
     * Try automatically first.
     * If Chrome requires a user gesture,
     * the document click fallback below starts it.
     */
    setTimeout(
        function () {
            startListening();
        },
        700
    );
}

/*
 * Browser permission/user-gesture fallback.
 * Clicking anywhere once can unlock microphone access.
 */
document.addEventListener(
    "click",
    function () {

        if (
            shouldKeepListening &&
            !listening &&
            !processing &&
            !speaking
        ) {
            startListening();
        }

    },
    {
        passive: true
    }
);

window.addEventListener(
    "load",
    initializeAJVoice
);


</script>
